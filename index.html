<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e9edf3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>RoBot Fight</title>
<style>
  :root { --blue:#2f7df6; --red:#f0443e; --bg:#e9edf3; --ink:#2a3342; --muted:#c9d1dc; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#d5dbe4; overflow:hidden; overscroll-behavior:none;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--ink);
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
  #app { position:relative; height:100%; width:100%; max-width:calc(100vh * 0.6); margin:0 auto;
    background:var(--bg); display:flex; flex-direction:column; overflow:hidden; }
  @media (pointer:coarse), (max-width:600px) { #app { max-width:none; } html, body { background:var(--bg); } }

  /* HUD */
  #hud { flex:0 0 auto; height:calc(40px + env(safe-area-inset-top)); padding:calc(8px + env(safe-area-inset-top)) 14px 0;
    display:flex; gap:12px; align-items:center; font-size:11px; font-weight:700; letter-spacing:.08em; }
  .hp { flex:1; display:flex; align-items:center; gap:8px; }
  .hp.bot { flex-direction:row-reverse; }
  .hp .bar { position:relative; flex:1; height:18px; border-radius:9px; background:var(--muted); overflow:hidden; }
  .hp .fill { height:100%; width:100%; border-radius:9px; transition:width .12s linear; }
  .hp .num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900;
    letter-spacing:.02em; color:#fff; -webkit-text-stroke:3px #1c2533; paint-order:stroke fill; }
  .hp.you .fill { background:var(--blue); }
  .hp.bot .fill { background:var(--red); margin-left:auto; }
  /* Second HUD row: your passives (left), match score (centre), everything the bot owns (right) */
  #hud2 { flex:0 0 auto; height:26px; padding:0 14px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .loadout { flex:1; display:flex; gap:3px; align-items:center; min-width:0; }
  .loadout.right { justify-content:flex-end; }
  .mini { width:20px; height:20px; border-radius:50%; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--n1), var(--n2)); box-shadow:0 1px 2px rgba(40,60,90,.25); }
  .mini svg { width:13px; height:13px; }
  .loadout.many { gap:2px; } .loadout.many .mini { width:15px; height:15px; } .loadout.many .mini svg { width:10px; height:10px; }
  #score { flex:0 0 auto; display:flex; align-items:center; gap:7px; font-size:11px; font-weight:900; letter-spacing:.08em; color:#6b778a; }
  .pips { display:flex; gap:3px; }
  .pips i { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .pips.you i.on { background:var(--blue); } .pips.bot i.on { background:var(--red); }
  #score .pips { font-size:15px; letter-spacing:0; } #score .pips.you { color:var(--blue); } #score .pips.bot { color:var(--red); }
  #hud2 .loadout { flex:1 1 0; overflow:hidden; }

  /* Arena viewport */
  #stage { flex:0 1 var(--stageH, 100%); position:relative; min-height:0; }   /* --stageH = height the arena needs at this width */
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* Rising damage numbers */
  .dmg { position:absolute; z-index:3; pointer-events:none; font-weight:900; color:#ffd60a; line-height:1;
    -webkit-text-stroke:4px #000; paint-order:stroke fill; transform:translate(-50%,-50%);
    animation:dmgRise .85s ease-out forwards; }
  @keyframes dmgRise {
    0% { transform:translate(-50%,-50%) scale(.6); opacity:1; }
    15% { transform:translate(-50%,-90%) scale(1.15); opacity:1; }
    70% { opacity:1; }
    100% { transform:translate(-50%,-320%) scale(1); opacity:0; }
  }

  /* Controls: energy counter on the left, then the ability buttons (sized by --bs, set from the number of buttons) */
  #controls { --bs:66px; flex:1 0 calc(104px + env(safe-area-inset-bottom)); position:relative; display:flex; justify-content:flex-start; align-items:flex-start;
    padding:3px 6px env(safe-area-inset-bottom) 8px; background:var(--bg); }
  #btnRow { flex:1 1 0; min-width:0; display:flex; justify-content:space-evenly; align-items:flex-start; }
  /* Energy: the number you have, and a bolt that fills up as the next point arrives */
  #energyBox { flex:0 0 auto; width:66px; height:var(--bs); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
  #energyBox .row { display:flex; align-items:baseline; gap:4px; }
  #energyRate { font-size:10px; font-weight:800; color:#9a86c9; white-space:nowrap; }
  #energyBox .eicon { position:relative; width:30px; height:39px; }
  #energyBox .eicon svg { position:absolute; inset:0; width:100%; height:100%; }
  #energyBox .eicon .full { clip-path:inset(calc((1 - var(--f, 0)) * 100%) 0 0 0); }
  #energyNum { font-size:22px; font-weight:900; line-height:1; color:#7c4ddb; font-variant-numeric:tabular-nums; }
  #btnThrust { display:none; }   /* thrusters are shelved: CFG.thrustersEnabled brings the button back */
  .ability { position:relative; width:var(--bs); height:var(--bs); display:flex; align-items:center; justify-content:center; touch-action:none; }
  .ability .base { position:absolute; inset:-24px; border-radius:50%; background:rgba(47,125,246,.10);
    border:2px solid rgba(47,125,246,.35); opacity:0; transform:scale(.6); transition:opacity .1s, transform .1s; pointer-events:none; }
  .ability.active .base { opacity:1; transform:scale(1); }
  /* Knob: the ring shows availability / cooldown, the inside is the ability's icon on its nature colour */
  .ability .knob { --p:1; position:relative; width:calc(var(--bs) - 2px); height:calc(var(--bs) - 2px); border-radius:50%;
    background:conic-gradient(var(--ink) calc(var(--p) * 360deg), var(--muted) 0);
    display:flex; flex-direction:column; align-items:center; justify-content:center; will-change:transform;
    box-shadow:0 3px 8px rgba(40,60,90,.2); transition:transform .06s; }
  .ability .knob::before { content:""; position:absolute; inset:5px; border-radius:50%; background:linear-gradient(160deg, var(--n1, #fff), var(--n2, #fff)); }
  .ability .knob svg { position:relative; width:calc(var(--bs) * .42); height:calc(var(--bs) * .42); margin-top:1px; }
  .ability .knob span { position:relative; font-size:calc(var(--bs) * .125); font-weight:900; letter-spacing:.06em; color:#fff; margin-top:-1px; }
  .ability.pressed .knob { transform:scale(.88); }
  #controls.tiny .ability .knob span { display:none; } #controls.tiny .ability .knob svg { width:calc(var(--bs) * .5); height:calc(var(--bs) * .5); }
  #controls.tiny .ability .cost { font-size:10px; height:16px; padding:0 4px; }
  /* Energy cost under each button */
  .ability .cost { position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); z-index:1; pointer-events:none; display:flex; align-items:center; gap:2px;
    height:19px; padding:0 7px 0 6px; border-radius:10px; background:#8b5cf6; border:2px solid var(--bg); color:#fff; font-size:12px; font-weight:900; white-space:nowrap; }
  .ability .cost svg { width:7px; height:10px; } .ability .cost small { font-size:7.5px; font-weight:800; }
  .ability.dim .knob { box-shadow:none; }
  .ability.dim .knob::before, .ability.dim .knob svg, .ability.dim .knob span { filter:grayscale(1); opacity:.5; }
  .ability.active .knob { width:calc(var(--bs) * .8); height:calc(var(--bs) * .8); }

  /* Draft screen: a handful of big cards, one tap picks */
  #draft { position:absolute; inset:0; z-index:9; background:var(--bg); display:flex; flex-direction:column; align-items:stretch;
    padding:calc(12px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom)); gap:6px; overflow:hidden; }
  #draft.hidden { display:none; }
  #draft { background:linear-gradient(180deg, #fbe9e8 0, var(--bg) 22%, var(--bg) 78%, #e3eeff 100%); }
  .side { flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:7px 12px 7px 8px; border-radius:16px; background:#fff;
    box-shadow:0 2px 8px rgba(40,60,90,.12); border:2.5px solid transparent; transition:border-color .15s, box-shadow .15s; }
  .side .av { width:56px; height:46px; flex:0 0 auto; } .side .av svg { width:100%; height:100%; display:block; }
  .side .info { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .side .nm { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:900; letter-spacing:.1em; }
  .side.bot .nm { color:var(--red); } .side.you .nm { color:var(--blue); }
  .side .nm .tag { margin-left:auto; font-size:9px; letter-spacing:.08em; color:#fff; border-radius:7px; padding:2px 7px; opacity:0; transition:opacity .15s; }
  .side.bot .tag { background:var(--red); } .side.you .tag { background:var(--blue); }
  .side.turn .tag { opacity:1; }
  .side.bot.turn { border-color:var(--red); box-shadow:0 0 0 4px rgba(240,68,62,.15); }
  .side.you.turn { border-color:var(--blue); box-shadow:0 0 0 4px rgba(47,125,246,.15); }
  .side .loadout { min-height:26px; gap:4px; }
  .side .mini { width:26px; height:26px; } .side .mini svg { width:17px; height:17px; }
  .side .loadout.many .mini { width:21px; height:21px; } .side .loadout.many .mini svg { width:14px; height:14px; }
  .side .none { font-size:11px; font-weight:600; color:#9aa6b6; }
  #draftHead { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:1px; margin-top:2px; }
  #draftHead .top { display:flex; align-items:baseline; gap:8px; }
  #draft h2 { margin:0; font-size:20px; letter-spacing:.06em; }
  #draftGoal { font-size:10px; font-weight:900; letter-spacing:.1em; color:#8a96a8; }
  #draft p { margin:0; text-align:center; }
  #draftStatus { min-height:19px; font-size:14px; color:var(--ink); font-weight:800; letter-spacing:.03em; }
  #cards { flex:1 1 auto; min-height:0; overflow-y:auto; touch-action:pan-y; display:grid; grid-template-columns:1fr 1fr;
    gap:13px 12px; align-content:center; padding:10px 8px 6px; }
  .n-weapon { --n1:#ffb866; --n2:#f2711c; --nb:#d85a0a; }
  .n-enhancement { --n1:#63e2d1; --n2:#12a594; --nb:#0b8577; }
  .n-deployable { --n1:#f9a3d6; --n2:#d6409f; --nb:#b02a80; }
  .card { position:relative; background:#fff; border:3px solid var(--nb); border-radius:13px; padding-bottom:7px;
    box-shadow:0 3px 0 var(--nb), 0 5px 9px rgba(40,60,90,.16); transition:transform .08s; }
  .card:last-child:nth-child(odd) { grid-column:1 / -1; width:calc(50% - 6px); justify-self:center; }
  #cards.myturn .card:not(.taken):active { transform:scale(.96); }
  .card .art { height:46px; border-radius:9px 9px 0 0; background:linear-gradient(160deg, var(--n1), var(--n2));
    display:flex; align-items:center; justify-content:center; }
  .card .art svg { width:38px; height:38px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.18)); }
  .card .name { text-align:center; font-size:15px; font-weight:900; letter-spacing:.03em; margin:5px 2px 4px; }
  .card .tags { display:flex; justify-content:center; gap:3px; flex-wrap:wrap; padding:0 3px; }
  .card .desc { font-size:11.5px; line-height:1.3; color:#536074; text-align:center; padding:5px 8px 0; }
  .chip { font-size:8.5px; font-weight:800; letter-spacing:.06em; border-radius:6px; padding:2px 5px; background:#e8edf4; color:#5b6b82; white-space:nowrap; }
  .chip.nat { background:var(--n2); color:#fff; }
  .card .badge { position:absolute; top:-9px; left:-8px; min-width:28px; height:28px; padding:0 5px; border-radius:14px; background:#8b5cf6;
    border:2.5px solid #fff; box-shadow:0 2px 4px rgba(60,30,120,.35); color:#fff; font-size:14px; font-weight:900;
    display:flex; align-items:baseline; justify-content:center; line-height:23px; }
  .card .badge small { font-size:8px; font-weight:800; margin-left:1px; }
  .card .cdchip { position:absolute; top:4px; right:4px; font-size:9px; font-weight:800; color:#fff; background:rgba(28,37,51,.72); border-radius:7px; padding:1px 5px; }
  .card .owner { display:none; position:absolute; top:16px; left:50%; transform:translateX(-50%) rotate(-7deg); font-size:14px; font-weight:900;
    letter-spacing:.1em; color:#fff; border-radius:8px; padding:2px 12px; border:2px solid #fff; z-index:1; }
  .card.taken .owner { display:block; }
  .card.taken .art, .card.taken .name, .card.taken .tags, .card.taken .badge, .card.taken .desc { opacity:.35; filter:grayscale(.8); }
  .card.mine { border-color:var(--blue); box-shadow:0 3px 0 var(--blue); } .card.mine .owner { background:var(--blue); }
  .card.theirs { border-color:var(--red); box-shadow:0 3px 0 var(--red); } .card.theirs .owner { background:var(--red); }

  /* Overlay */
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(233,237,243,.82); z-index:10; text-align:center; gap:10px; }
  #overlay.hidden { display:none; }
  #overlay h1 { margin:0; font-size:36px; letter-spacing:.04em; }
  #overlay p { white-space:pre-line; line-height:1.6; }
  #overlay p { margin:0; font-size:14px; font-weight:600; color:#6b778a; letter-spacing:.06em; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hp you"><span>YOU</span><div class="bar"><div class="fill" id="hpYou"></div><span class="num" id="hpYouNum"></span></div></div>
    <div class="hp bot"><span>BOT</span><div class="bar"><div class="fill" id="hpBot"></div><span class="num" id="hpBotNum"></span></div></div>
  </div>
  <div id="hud2">
    <div class="loadout" id="loadYou"></div>
    <div id="score"><span class="pips you" id="pipsYou"></span><span id="roundLbl">ROUND 1</span><span class="pips bot" id="pipsBot"></span></div>
    <div class="loadout right" id="loadBot"></div>
  </div>
  <div id="stage"></div>
  <div id="controls">
    <div id="energyBox">
      <div class="eicon">
        <svg viewBox="0 0 34 44"><path d="M19 1L3 25h11l-3 18 20-26H19z" fill="#c9d1dc"/></svg>
        <svg class="full" id="energyIcon" viewBox="0 0 34 44"><path d="M19 1L3 25h11l-3 18 20-26H19z" fill="#8b5cf6"/></svg>
      </div>
      <div class="row"><span id="energyRate">+1/s</span><b id="energyNum">0</b></div>
    </div>
    <div id="btnRow">
    <div class="ability" id="btnThrust"><div class="base"></div><div class="knob"><span>THRUST</span></div></div>
    <div class="ability" id="btnFlame"><div class="base"></div><div class="knob"><span>FLAME</span></div></div>
    <div class="ability tap" id="btnSlam"><div class="knob"><span>SLAM</span></div></div>
    <div class="ability tap" id="btnShield"><div class="knob"><span>SHIELD</span></div></div>
    <div class="ability tap" id="btnMine"><div class="knob"><span>MINE</span></div></div>
    <div class="ability tap" id="btnTurret"><div class="knob"><span>TURRET</span></div></div>
    <div class="ability tap" id="btnShotgun"><div class="knob"><span>SHOTGUN</span></div></div>
    <div class="ability tap" id="btnPusher"><div class="knob"><span>PUSHER</span></div></div>
    <div class="ability tap" id="btnHook"><div class="knob"><span>HOOK</span></div></div>
    <div class="ability tap" id="btnPistol"><div class="knob"><span>PISTOL</span></div></div>
    <div class="ability tap" id="btnRail"><div class="knob"><span>RAIL</span></div></div>
    <div class="ability" id="btnGatling"><div class="base"></div><div class="knob"><span>GATLING</span></div></div>
    <div class="ability" id="btnMortar"><div class="base"></div><div class="knob"><span>MORTAR</span></div></div>
    <div class="ability" id="btnLaser"><div class="base"></div><div class="knob"><span>REPEATER</span></div></div>
    </div>
  </div>
  <div id="draft" class="hidden">
    <div class="side bot">
      <div class="av" id="avBot"></div>
      <div class="info">
        <div class="nm">BOT <span class="pips bot" id="dPipsBot"></span><span class="tag">PICKING</span></div>
        <div class="loadout" id="dLoadBot"></div>
      </div>
    </div>
    <div id="draftHead">
      <div class="top"><h2 id="draftTitle">ROUND 1</h2><span id="draftGoal"></span></div>
      <p id="draftStatus"></p>
    </div>
    <div id="cards"></div>
    <div class="side you">
      <div class="av" id="avYou"></div>
      <div class="info">
        <div class="nm">YOU <span class="pips you" id="dPipsYou"></span><span class="tag">YOUR PICK</span></div>
        <div class="loadout" id="dLoadYou"></div>
      </div>
    </div>
  </div>
  <div id="overlay"><h1 id="ovTitle">ROBOT FIGHT</h1><p id="ovSub">TAP TO START</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

// ---------- Tuning ----------
const CFG = {
  arenaW: 10, arenaD: 20, wallH: 0.6, wallT: 0.4,
  robotR: 0.75, robotH: 0.55,
  baseSpeed: 2.75,
  // Flamer: short-range continuous cone, paid for with energy
  flameRange: 3.2,          // reach measured from the robot's edge
  flameHalfAngle: 16,       // degrees
  flameDps: 12,
  flameCost: 4,            // energy per second while firing
  flameMinStart: 1,         // energy needed to ignite
  // Slam: tap, hop up, land, damage everything close
  slamCost: 6,
  slamSettle: 0.4,          // hidden lockout after landing before the next slam
  slamTime: 0.5,            // seconds in the air
  slamHeight: 1.3,
  slamRadius: 2.5,          // centre-to-centre distance that gets hit on landing
  slamDamage: 30,
  // Shield: tap, invulnerable for a while
  shieldCost: 2,
  shieldTime: 3,
  // Mortar: slow lobbed shell, area damage where it lands
  mortarCost: 7,
  mortarDamage: 20,
  mortarRadius: 2.8,        // blast radius drawn on the floor
  mortarFlight: 1.75,        // seconds in the air, whatever the range
  mortarHeight: 4,
  mortarMinRange: 2.5, mortarMaxRange: 12,
  noAimMortarRadius: 3.5,   // bigger blast for the player's mortar in NoAiming mode (normal is mortarRadius)
  // Gatling: hold to stream bullets with unlimited range; 
  gatlingRate: 5,           // shots per second
  gatlingCost: 1,           // energy per shot (5 per second of fire)
  gatlingDamage: 3.3,       // was 2 at 3 energy per shot; scaled by 5/3 when the cost became 1 (= 5 old energy)
  turretDamage: 2,          // turret bullets keep their old damage
  gatlingSpeed: 14,
  gatlingLead: 0.5,         // how much of the full lead the auto-aim applies (1 = perfect prediction)
  gatlingSpread: 13,        // degrees either side
  // Cooldowns in seconds, on top of the energy cost (0 = energy only). Starts when the ability is used.
  // Mine: dropped where you stand, arms after a moment, explodes when the enemy rolls over it
  mineCost: 4,
  mineSlow: 0.5,            // speed multiplier applied to a robot that hits a mine
  mineSlowTime: 4,          // seconds the slow lasts
  mineDamage: 20,
  mineArm: 1,               // seconds before it becomes live
  mineTrigger: 0.45,        // extra reach beyond the robot's radius
  // Turret: dropped where you stand, shoots gatling-strength bullets on its own for a while
  turretCost: 8,
  turretLife: 8,
  turretInterval: 0.75,     // seconds between shots
  turretRadius: 0.42,       // turrets are solid: robots bounce off them and shots stop on them
  turretSpread: 6,        // degrees either side
  // Spikes: passive, every robot-to-robot bump hurts the other robot
  spikesDamage: 10,
  // Railgun: tap, one very fast auto-aimed shot. Hard to miss, so it is expensive.
  railCost: 10,
  railDamage: 12,
  railSpeed: 60,
  // Pistol: tap, one auto-aimed round at moderate speed. Hits hard but the long cooldown makes it a support weapon.
  pistolCost: 3,
  pistolDamage: 5,
  pistolSpeed: 12,
  // Shotgun: tap, a fan of pellets aimed at where the enemy is right now (no lead). Deadly up close, unreliable at range.
  shotgunCost: 5,
  shotgunPellets: 5,
  shotgunAngle: 5,          // degrees between neighbouring pellets
  shotgunDamage: 4,         // per pellet
  shotgunSpeed: 13,
  // Pusher: tap, a fast shot at the enemy's current position (no lead) that shoves it onto a new course.
  // The shove acts along the line from the impact point through the robot's centre: a head-on hit turns it
  // right around, a hit on its flank knocks it sideways.
  pusherCost: 7,
  pusherDamage: 8,
  pusherSpeed: 30,
  pusherForce: 2,           // shove strength, in multiples of the robot's own speed (2 = exact reversal on a head-on hit)
  // Hook: tap, throws a hook on a rope. If it lands, the enemy takes a little damage and is turned to head straight at you.
  hookCost: 3,
  hookDamage: 5,
  hookSpeed: 20,
  hookTug: 0.45,            // seconds the rope stays taut after it lands
  // Every ability has the same short cooldown (not shown on cards because it is the same everywhere); Shield's is longer and is shown.
  // For hold abilities (flamer, gatling) it starts when you stop firing.
  baseCooldown: 4,
  cooldown: { laser: 4, flame: 4, slam: 4, shield: 15, mortar: 4, gatling: 4, mine: 4, turret: 4, rail: 4, shotgun: 4, pusher: 4, hook: 4, pistol: 10 },
  // Armor: passive, every hit against you does this much less damage
  armorReduce: 1,
  // Ricochet: passive, how many times your shots bounce off walls before disappearing
  ricochetBounces: 2,
  // Deflector: passive, chance that a shot (laser, gatling, railgun, turret) bounces off you harmlessly
  deflectChance: 0.25,
  // Move Speed: passive, the robot travels this much faster
  speedBonus: 0.25,
  // Reactor: passive, energy regenerates this much faster

// Fit the whole arena (incl. walls) inside the stage, whatever its aspect ratio
function fitCamera() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  const inv = camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const v = new THREE.Vector3(), ex = HW + CFG.wallT, ez = HD + CFG.wallT;
  for (const x of [-ex, ex]) for (const y of [0, CFG.wallH]) for (const z of [-ez, ez]) {
    v.set(x, y, z).applyMatrix4(inv);
    minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x);
    minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  let hw = (maxX - minX) / 2 * 1.05, hh = (maxY - minY) / 2 * 1.012;   // side margin for looks; almost none above/below
  const app = document.getElementById('app');
  app.style.setProperty('--stageH', Math.ceil(app.clientWidth * hh / hw) + 'px');   // keeps the buttons right under the arena
  const aspect = w / h;
  if (hw / hh > aspect) hh = hw / aspect; else hw = hh * aspect;
  camera.left = cx - hw; camera.right = cx + hw; camera.top = cy + hh; camera.bottom = cy - hh;
  camera.updateProjectionMatrix();
}

function collideTurrets() {

    let nx = r.x - t.x, nz = r.z - t.z; const d = Math.hypot(nx, nz), min = CFG.robotR + CFG.turretRadius;
    if (d >= min) { t.solidFor.add(r); continue; }
    if (!t.solidFor.has(r) || r.y > 0.3) continue;
    if (d < 1e-4) { nx = 1; nz = 0; } else { nx /= d; nz /= d; }
    r.x = t.x + nx * min; r.z = t.z + nz * min;
    const vn = r.vx * nx + r.vz * nz;
    if (vn < 0) { r.vx -= 2 * vn * nx; r.vz -= 2 * vn * nz; }      // mirror bounce, speed unchanged

function makeStick(el) {

    if (noAim) return;                 // NoAiming: the button never turns into a joystick
    let dx = px - s.ox, dy = py - s.oy; const d = Math.hypot(dx, dy);
    if (d > DEAD) s.dragged = true;

    if (d > DEAD) { s.x = dx / Math.hypot(dx, dy); s.y = dy / Math.hypot(dx, dy); s.mag = Math.min(1, d / R); }
    else { s.x = s.y = s.mag = 0; }

    e.preventDefault();

    s.held = true; s.id = e.pointerId; s.ox = e.clientX; s.oy = e.clientY; s.dragged = false; s.x = s.y = s.mag = 0;

  el.addEventListener('pointercancel', e => end(e, true));

}

      if (!d) d = aimAt(r, noAim || !r.isPlayer ? CFG.laserSpeed : 0);
      const sa = (Math.random() * 2 - 1) * CFG.laserSpread * Math.PI / 180, cs = Math.cos(sa), sn = Math.sin(sa);
      fireShot(r, d.x * cs - d.z * sn, d.x * sn + d.z * cs);
      r.burst.t += CFG.laserInterval;
      if (--r.burst.n <= 0) r.burst = null;
    }
  }
  r.flash = Math.max(0, r.flash - dt * 6);
}

function collideRobots() {
  const a = player, b = bot;
  if (a.y > 0.3 || b.y > 0.3) return;   // a slamming robot hops over the other one
  let nx = b.x - a.x, nz = b.z - a.z; const d = Math.hypot(nx, nz), min = CFG.robotR * 2;
  if (d >= min) return;
  if (d < 1e-4) { nx = 1; nz = 0; } else { nx /= d; nz /= d; }
  const push = (min - d) / 2;
  a.x -= nx * push; a.z -= nz * push; b.x += nx * push; b.z += nz * push;
  const rel = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
  if (rel < 0) {                        // equal-mass elastic bounce: swap normal components
    for (const [r, o] of [[a, b], [b, a]])      // Spikes: the bump itself hurts
      if (r.abilities.has('spikes') && o.shieldT <= 0) hurt(o, CFG.spikesDamage, 1);
    a.vx += rel * nx; a.vz += rel * nz; b.vx -= rel * nx; b.vz -= rel * nz;
    // never let a bounce leave a robot stalled: keep them separating at base speed
    for (const [r, sg] of [[a, -1], [b, 1]]) {
      const sp = Math.hypot(r.vx, r.vz);
      if (sp < 0.5) { r.vx = nx * sg * CFG.baseSpeed; r.vz = nz * sg * CFG.baseSpeed; }
      else if (!r.thrusting) { r.vx *= CFG.baseSpeed / sp; r.vz *= CFG.baseSpeed / sp; }
    }
  }
}

function stepLasers(dt) {
  for (let i = lasers.length - 1; i >= 0; i--) {
    const s = lasers[i], e = enemyOf(s.owner);
    const n = Math.max(1, Math.ceil(Math.hypot(s.vx, s.vz) * dt / 0.6)), h = dt / n;   // sub-steps for fast shots
    let dead = false;
    for (let k = 0; k < n && !dead; k++) {
      s.x += s.vx * h; s.z += s.vz * h;
      dead = Math.abs(s.x) > HW || Math.abs(s.z) > HD;
      if (dead && (s.bounced || 0) < CFG.ricochetBounces && s.owner.abilities.has('ricochet')) {     // Ricochet: wall bounces
        if (Math.abs(s.x) > HW) { s.vx = -s.vx; s.x = Math.sign(s.x) * HW; }
        if (Math.abs(s.z) > HD) { s.vz = -s.vz; s.z = Math.sign(s.z) * HD; }
        s.bounced = (s.bounced || 0) + 1; s.m.rotation.y = Math.atan2(s.vx, s.vz); dead = false;
      }
      if (!dead) for (const t of turrets)                               // any turret stops any shot
        if (Math.hypot(t.x - s.x, t.z - s.z) < CFG.turretRadius + 0.1) { dead = true; break; }
      const hd = Math.hypot(s.x - e.x, s.z - e.z);
      if (!dead && hd < CFG.robotR + 0.2) {
        if (e.shieldT <= 0 && e.abilities.has('deflector') && Math.random() < CFG.deflectChance) {
          // Deflector: the shot bounces off the round body (mirrored about the surface normal) and does no damage
          const nx = hd > 1e-4 ? (s.x - e.x) / hd : 1, nz = hd > 1e-4 ? (s.z - e.z) / hd : 0, vn = s.vx * nx + s.vz * nz;
          if (vn < 0) { s.vx -= 2 * vn * nx; s.vz -= 2 * vn * nz; }
          s.x = e.x + nx * (CFG.robotR + 0.22); s.z = e.z + nz * (CFG.robotR + 0.22);
          s.m.rotation.y = Math.atan2(s.vx, s.vz);
          addRing(s.x, s.z, 0xffffff, 0.8);
        } else {
          dead = true;
          if (e.shieldT <= 0) {
            hurt(e, s.dmg, s.flash || 1);
            if (s.push) shove(e, hd > 1e-4 ? (e.x - s.x) / hd : 0, hd > 1e-4 ? (e.z - s.z) / hd : 1);
          }
        }
      }
    }
    if (dead) { scene.remove(s.m); lasers.splice(i, 1); } else s.m.position.set(s.x, CFG.robotH * 0.6, s.z);
  }
}

function startShotgun(r) {

  r.energy -= CFG.shotgunCost; startCd(r, 'shotgun');
  const d = aimAt(r, 0), mid = Math.atan2(d.x, d.z), n = CFG.shotgunPellets;      // straight at the enemy's current position
  for (let i = 0; i < n; i++) {
    const a = mid + (i - (n - 1) / 2) * CFG.shotgunAngle * Math.PI / 180, dx = Math.sin(a), dz = Math.cos(a);
    const m = new THREE.Mesh(bulletGeo, laserMats[r.isPlayer]);
    const s = { m, owner: r, x: r.x + dx * (CFG.robotR + 0.21), z: r.z + dz * (CFG.robotR + 0.21),
      vx: dx * CFG.shotgunSpeed, vz: dz * CFG.shotgunSpeed, dmg: CFG.shotgunDamage };

    scene.add(m); lasers.push(s);

}
// ---------- Hook ----------
// The hook head flies like a shot; the rope is a string of beads on a curve that starts loose and wavy
// (thrown) and pulls straight as the hook reaches full stretch, then snaps taut when it catches.
const hookHeadGeo = new THREE.ConeGeometry(0.2, 0.55, 8); hookHeadGeo.rotateX(Math.PI / 2);
const ropeGeo = new THREE.SphereGeometry(0.075, 6, 5), ropeMat = new THREE.MeshBasicMaterial({ color: 0x4a5568 });
const ROPE_BEADS = 26;
const hooks = [];
function startHook(r) {
  if (r.energy < CFG.hookCost || !ready(r, 'hook')) return false;
  r.energy -= CFG.hookCost; startCd(r, 'hook');
  const d = aimAt(r, CFG.hookSpeed), e = enemyOf(r);
  const head = new THREE.Mesh(hookHeadGeo, new THREE.MeshLambertMaterial({ color: r.color })); head.castShadow = true;
  head.rotation.y = Math.atan2(d.x, d.z); scene.add(head);
  const beads = Array.from({ length: ROPE_BEADS }, () => { const b = new THREE.Mesh(ropeGeo, ropeMat); scene.add(b); return b; });
  hooks.push({ owner: r, head, beads, x: r.x + d.x * CFG.robotR, z: r.z + d.z * CFG.robotR, vx: d.x * CFG.hookSpeed, vz: d.z * CFG.hookSpeed,
    t: 0, reach: Math.hypot(e.x - r.x, e.z - r.z) || 1, caught: null, tug: 0, phase: Math.random() * 6.28 });
  return true;
}
function removeHook(h) { scene.remove(h.head); h.head.material.dispose(); for (const b of h.beads) scene.remove(b); }
function stepHooks(dt) {
  for (let i = hooks.length - 1; i >= 0; i--) {
    const h = hooks[i], r = h.owner, e = enemyOf(r); h.t += dt;
    let dead = false;
    if (h.caught) {                                   // rope is on: follow the enemy until the tug is over
      h.tug -= dt; h.x = e.x; h.z = e.z; dead = h.tug <= 0;
    } else {
      const n = Math.max(1, Math.ceil(CFG.hookSpeed * dt / 0.5));
      for (let k = 0; k < n && !dead && !h.caught; k++) {
        h.x += h.vx * dt / n; h.z += h.vz * dt / n;
        if (Math.abs(h.x) > HW || Math.abs(h.z) > HD) dead = true;                                      // missed: hit a wall
        for (const t of turrets) if (Math.hypot(t.x - h.x, t.z - h.z) < CFG.turretRadius + 0.15) dead = true;
        if (!dead && Math.hypot(e.x - h.x, e.z - h.z) < CFG.robotR + 0.25) {
          if (e.shieldT > 0) dead = true;                                                               // shield shrugs it off
          else {
            hurt(e, CFG.hookDamage, 1.2);
            // the enemy is yanked onto a course straight at the thrower; the thrower's own course is untouched
            const dx = r.x - e.x, dz = r.z - e.z, l = Math.hypot(dx, dz) || 1, sp = Math.hypot(e.vx, e.vz) || CFG.baseSpeed;
            e.vx = dx / l * sp; e.vz = dz / l * sp;
            h.caught = e; h.tug = CFG.hookTug;
          }
        }
      }
    }
    if (dead) { removeHook(h); hooks.splice(i, 1); continue; }
    // draw: head at the tip, beads along a sagging, wavy curve from the thrower to the tip
    const ax = r.x, az = r.z, bx = h.x, bz = h.z, len = Math.hypot(bx - ax, bz - az) || 1, px = -(bz - az) / len, pz = (bx - ax) / len;
    const slack = h.caught ? 0.12 * (h.tug / CFG.hookTug) : Math.max(0.15, 1 - len / h.reach);      // 1 = just thrown, 0 = fully stretched
    h.head.position.set(bx, CFG.robotH * 0.6, bz); h.head.visible = !h.caught;
    for (let j = 0; j < ROPE_BEADS; j++) {
      const u = (j + 0.5) / ROPE_BEADS, bow = Math.sin(Math.PI * u);
      const side = Math.sin(u * Math.PI * 3 + h.phase + h.t * 9) * bow * slack * 0.9;
      h.beads[j].position.set(ax + (bx - ax) * u + px * side, CFG.robotH * 0.6 + bow * slack * 1.4, az + (bz - az) * u + pz * side);
    }
  }
}

function startPusher(r) {

// Shove a robot along (nx, nz), then put it back on its normal speed: only its heading changes
function shove(e, nx, nz) {
  const sp = Math.hypot(e.vx, e.vz) || CFG.baseSpeed;
  let vx = e.vx + nx * sp * CFG.pusherForce, vz = e.vz + nz * sp * CFG.pusherForce;
  const l = Math.hypot(vx, vz);
  if (l < 1e-3) { vx = nx; vz = nz; } else { vx /= l; vz /= l; }
  e.vx = vx * sp; e.vz = vz * sp;
  addRing(e.x, e.z, 0xffffff, 1.3);

  hook: '<path d="M31 9v20a10 10 0 0 1-20 0v-5"/><path d="M5 29l6-7 6 7" stroke-width="3.5"/><circle cx="31" cy="7" r="3.5" fill="#fff" stroke="none"/>',
  pistol: '<path d="M6 17h30v8H21v10a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3V25H6z" fill="#fff" stroke="none"/><circle cx="42" cy="21" r="2.5" fill="#fff" stroke="none"/>',
  rail: '<path fill="#fff" stroke="none" d="M29 3L9 27h11l-4 18 23-27H27z"/>',
  turret: '<path fill="rgba(255,255,255,.3)" d="M11 41l4-14h18l4 14z"/><path d="M24 27L37 10" stroke-width="6"/>',
  spikes: `<polygon fill="rgba(255,255,255,.3)" points="${starPts(9, 20, 11)}"/><circle cx="24" cy="24" r="5" fill="#fff"/>`,
  ricochet: '<path d="M6 41h36" stroke-width="5"/><path d="M8 10l15 28 15-24"/><path d="M30 13l9-1 1 9" stroke-width="3.5"/>',
  deflector: '<circle cx="17" cy="30" r="11" fill="rgba(255,255,255,.3)"/><path d="M43 33L29 25 39 8"/><path d="M31 8h8v8" stroke-width="3.5"/>',
  speed: '<path d="M8 11l13 13-13 13M25 11l13 13-13 13" stroke-width="5"/>',
  armor: '<polygon fill="rgba(255,255,255,.3)" points="24,5 40,14 40,34 24,43 8,34 8,14"/><polygon fill="#fff" stroke="none" points="24,15 32,19.5 32,28.5 24,33 16,28.5 16,19.5"/>',
  reactor: '<ellipse cx="24" cy="24" rx="19" ry="8" transform="rotate(35 24 24)" stroke-width="3"/><ellipse cx="24" cy="24" rx="19" ry="8" transform="rotate(-35 24 24)" stroke-width="3"/><circle cx="24" cy="24" r="4.5" fill="#fff" stroke="none"/>',
  durability: '<path fill="rgba(255,255,255,.3)" d="M24 41C9 30 6 20 13 13c5-4 11-1 11 4 0-5 6-8 11-4 7 7 4 17-11 28z"/><path d="M24 18v12M18 24h12" stroke-width="4"/>'
};
const svgIcon = id => `<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${ICON[id]}</svg>`;

const BOLT = '<svg viewBox="0 0 10 14"><path fill="#fff" d="M6.5 0L0 8h4l-1 6 7-8.5H5.5z"/></svg>';
const robotSVG = (c1, c2) => `<svg viewBox="0 0 56 46"><ellipse cx="28" cy="40" rx="24" ry="5" fill="rgba(30,45,70,.15)"/>` +
  `<path fill="${c2}" d="M4 17v12c0 7 11 12 24 12s24-5 24-12V17z"/><ellipse cx="28" cy="17" rx="24" ry="12" fill="${c1}"/>` +
  `<ellipse cx="28" cy="16" rx="13" ry="6.5" fill="#fff"/></svg>`;
document.getElementById('avBot').innerHTML = robotSVG('#f0443e', '#c2302b');
document.getElementById('avYou').innerHTML = robotSVG('#2f7df6', '#1f5fd0');
// Ability buttons show the same icon and colour as the cards
for (const id in ABILITIES) {
  const a = ABILITIES[id]; if (!a.btn) continue;
  const el = document.getElementById(a.btn);
  el.classList.add('n-' + a.nature);
  el.querySelector('.knob').innerHTML = svgIcon(id) + `<span>${a.name.toUpperCase()}</span>`;
  el.insertAdjacentHTML('beforeend', `<span class="cost">${BOLT}${a.costNum}<small>${a.costUnit}</small></span>`);
}
const isPassive = id => !ABILITIES[id].btn;
const miniIcon = id => `<span class="mini n-${ABILITIES[id].nature}">${svgIcon(id)}</span>`;
const pipsHTML = n => Array.from({ length: CFG.roundsToWin }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');

// ---------- Match: rounds of (draft one ability each, then fight); first to CFG.roundsToWin wins ----------
let match = null;      // { round, wins:{you,bot}, owned:{id: 'you'|'bot'}, lastLoser, done }
let draft = null;      // { order:[first, second], i, options:[ids] }
const dui = { root: document.getElementById('draft'), cards: document.getElementById('cards'),
  title: document.getElementById('draftTitle'), goal: document.getElementById('draftGoal'), status: document.getElementById('draftStatus') };
const ownedBy = who => Object.keys(match.owned).filter(id => match.owned[id] === who).concat(Array(match.reactors[who]).fill('reactor'));
function startMatch() {
  match = { round: 1, wins: { you: 0, bot: 0 }, owned: {}, reactors: { you: 0, bot: 0 }, lastLoser: null, done: false };
  startDraft();
}
// Score pips, round label and both loadouts, in the fight HUD and on the draft screen
function renderMatchUI() {
  const you = ownedBy('you'), bt = ownedBy('bot');
  document.getElementById('dPipsYou').innerHTML = pipsHTML(match.wins.you);
  document.getElementById('pipsYou').textContent = match.wins.you;      // fight HUD: plain numbers, pips would not fit beside long loadouts
  document.getElementById('dPipsBot').innerHTML = pipsHTML(match.wins.bot);
  document.getElementById('pipsBot').textContent = match.wins.bot;
  document.getElementById('roundLbl').textContent = 'ROUND ' + match.round;
  document.getElementById('loadYou').innerHTML = you.filter(isPassive).map(miniIcon).join('');   // actives are the buttons
  document.getElementById('loadBot').innerHTML = bt.map(miniIcon).join('');
  const none = '<span class="none">no abilities yet</span>';
  document.getElementById('dLoadYou').innerHTML = you.map(miniIcon).join('') || none;
  document.getElementById('dLoadBot').innerHTML = bt.map(miniIcon).join('') || none;
  for (const [id, n] of [['loadYou', you.filter(isPassive).length], ['loadBot', bt.length], ['dLoadYou', you.length], ['dLoadBot', bt.length]])
    document.getElementById(id).classList.toggle('many', n > (id[0] === 'd' ? 6 : 4));
}
const typeLabel = a => noAim && a.type === 'AIM' ? 'TAP' : a.type;   // in NoAiming nothing is aimed
function startDraft() {
  state = 'draft';
  // Offer a few random cards nobody owns yet. Round 1 offers only weapons and deployables, so nobody can start without a way to fight.
  let pool = Object.keys(ABILITIES).filter(id => !match.owned[id] && id !== 'reactor');
  if (match.round === 1) pool = pool.filter(id => ABILITIES[id].nature !== 'enhancement' && !CFG.notInRound1.includes(id));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const options = pool.slice(0, CFG.draftOptions);
  if (match.round > 1) options.push('reactor');     // Reactor: always offered as an extra card after round 1, and both sides can take it every time
  // Round 1: coin flip. After that the loser of the previous round picks first.
  // First pick alternates every round (random in round 1)
  if (!match.firstPicker) match.firstPicker = Math.random() < 0.5 ? 'you' : 'bot'; else match.firstPicker = match.firstPicker === 'you' ? 'bot' : 'you';
  const first = match.firstPicker;
  draft = { order: [first, first === 'you' ? 'bot' : 'you'], i: 0, options, rx: new Set() };
  dui.title.textContent = 'ROUND ' + match.round;
  dui.goal.textContent = 'FIRST TO ' + CFG.roundsToWin;
  dui.cards.innerHTML = '';
  for (const id of options) {
    const a = ABILITIES[id], c = document.createElement('div');
    c.className = 'card n-' + a.nature; c.dataset.id = id;
    c.innerHTML = '<span class="owner"></span>' +
      (a.costNum != null ? `<span class="badge">${a.costNum}<small>${a.costUnit}</small></span>` : '') +
      (CFG.cooldown[id] > CFG.baseCooldown ? `<span class="cdchip">⏱ ${CFG.cooldown[id]}s</span>` : '') +
      `<div class="art">${svgIcon(id)}</div><div class="name">${a.name}</div>` +
      `<div class="tags"><span class="chip nat">${NATURE[a.nature]}</span><span class="chip typ">${typeLabel(a)}</span></div>` +
      `<div class="desc">${a.desc}</div>`;
    c.addEventListener('click', () => { if (draft && draft.order[draft.i] === 'you') draftPick('you', id); });   // one tap picks
    dui.cards.appendChild(c);
  }
  renderMatchUI();
  dui.root.classList.remove('hidden');
  draftNext();
}
// A card is pickable if nobody owns it; Reactor is pickable once per side per draft
const pickable = (id, who) => id === 'reactor' ? !draft.rx.has(who) : !match.owned[id];
function draftPick(who, id) {
  if (!pickable(id, who) || draft.order[draft.i] !== who) return;
  const c = dui.cards.querySelector(`[data-id="${id}"]`);
  if (id === 'reactor') {
    match.reactors[who]++; draft.rx.add(who);
    c.classList.add(who === 'you' ? 'mine' : 'theirs');
    if (draft.rx.size > 1) c.classList.add('taken');       // both sides took it: grey it out
    c.querySelector('.owner').textContent = draft.rx.size > 1 ? 'BOTH' : who === 'you' ? 'YOU' : 'BOT';
    c.classList.toggle('mine', draft.rx.size === 1 && who === 'you'); c.classList.toggle('theirs', draft.rx.size === 1 && who === 'bot');
    c.querySelector('.owner').style.display = 'block';
  } else {
    match.owned[id] = who;
    c.classList.add('taken', who === 'you' ? 'mine' : 'theirs');
    c.querySelector('.owner').textContent = who === 'you' ? 'YOU' : 'BOT';
  }
  draft.i++;
  renderMatchUI();
  draftNext();
}
function draftNext() {
  const d = draft, who = d.order[d.i], left = d.options.filter(id => pickable(id, who));
  dui.cards.classList.toggle('myturn', who === 'you');
  dui.root.querySelector('.side.you').classList.toggle('turn', who === 'you');
  dui.root.querySelector('.side.bot').classList.toggle('turn', who === 'bot');
  if (d.i >= d.order.length || !left.length) { dui.status.textContent = 'FIGHT!'; setTimeout(() => d === draft && endDraft(), 900); return; }
  if (who === 'bot') {
    dui.status.textContent = d.i === 0 ? 'Bot picks first…' : 'Bot is picking…';
    setTimeout(() => d === draft && draftPick('bot', left[Math.floor(Math.random() * left.length)]), 900);
  } else dui.status.textContent = d.i === 0 ? 'You pick first: tap a card' : 'Your pick: tap a card';
}
function endDraft() {
  for (const r of robots) { const w = r.isPlayer ? 'you' : 'bot'; r.abilities = new Set(ownedBy(w)); r.reactors = match.reactors[w]; }
  for (const id in ABILITIES) if (ABILITIES[id].btn) document.getElementById(ABILITIES[id].btn).style.display = player.abilities.has(id) ? 'flex' : 'none';
  draft = null; dui.root.classList.add('hidden');
  layoutButtons();
  reset(); state = 'playing';
}
// Buttons grow to use the row: few abilities = big buttons, five abilities = smaller ones
function layoutButtons() {
  const row = document.getElementById('controls'), n = Math.max(1, [...player.abilities].filter(id => ABILITIES[id].btn).length);
  const size = Math.max(34, Math.min(84, Math.floor(document.getElementById('btnRow').clientWidth / n) - 6));
  row.style.setProperty('--bs', size + 'px');
  row.classList.toggle('tiny', size < 48);          // too small for a readable name: icon only
}
window.addEventListener('resize', layoutButtons);
// A fight ended: score it, then either the next round's draft or the end of the match
function endRound(winner, now) {
  state = 'over'; overlayShownAt = now;
  player.thrusting = bot.thrusting = false;
  player.firing = bot.firing = false;
  match.wins[winner]++; match.lastLoser = winner === 'you' ? 'bot' : 'you';
  const score = `YOU ${match.wins.you} – ${match.wins.bot} BOT`, col = winner === 'you' ? '#2f7df6' : '#f0443e';
  if (match.wins[winner] >= CFG.roundsToWin) {
    match.done = true; renderMatchUI();
    showOverlay(winner === 'you' ? 'MATCH WON!' : 'MATCH LOST', score + '\nTAP FOR A NEW MATCH', col);
  } else {
    renderMatchUI(); match.round++;
    showOverlay(winner === 'you' ? 'ROUND WON' : 'ROUND LOST', score + '\nTAP TO DRAFT FOR ROUND ' + match.round, col);
  }
}

const UP = new THREE.Vector3(0, 1, 0), tmpV = new THREE.Vector3();
function syncVisuals(time) {
  for (const r of robots) {
    r.mesh.position.set(r.x, CFG.robotH / 2 + r.y, r.z);
    r.mat.emissive.setScalar(r.flash * 0.8);
    r.slowRing.visible = r.slowT > 0 && (r.slowT > 0.6 || Math.sin(time * 40) > 0);
    r.shield.visible = r.shieldT > 0 && (r.shieldT > 0.6 || Math.sin(time * 40) > 0);   // blinks before it drops
    r.flame.visible = r.thrusting;
    if (r.thrusting) {
      const l = Math.hypot(r.thrust.x, r.thrust.z) || 1, ex = -r.thrust.x / l, ez = -r.thrust.z / l; // exhaust direction
      const len = (0.7 + 0.3 * Math.sin(time * 40)) * (0.5 + 0.5 * r.thrust.mag);
      r.flame.scale.set(1, len, 1);
      r.flame.position.set(r.x + ex * (CFG.robotR + 0.45 * len), CFG.robotH / 2, r.z + ez * (CFG.robotR + 0.45 * len));
      r.flame.quaternion.setFromUnitVectors(UP, tmpV.set(ex, 0, ez));
    }
  }
  // Laser aim preview
  aimLine.visible = state === 'playing' && laserStick.held && laserStick.mag > 0;
  if (aimLine.visible) { aimLine.position.x = player.x; aimLine.position.z = player.z; aimLine.rotation.y = Math.atan2(laserStick.x, laserStick.y); }
  // Flamer aim preview (no drag = auto-aim, so it points at the bot)
  flameAim.visible = state === 'playing' && flameStick.held;
  if (flameAim.visible) {
    let fx = flameStick.x, fz = flameStick.y;
    if (flameStick.mag <= 0) { fx = bot.x - player.x; fz = bot.z - player.z; }
    flameAim.position.x = player.x; flameAim.position.z = player.z; flameAim.rotation.y = Math.atan2(-fz, fx);
  }
  // HUD + buttons
  ui.hpYou.style.width = (player.hp / player.maxHp * 100) + '%';
  ui.hpBot.style.width = (bot.hp / bot.maxHp * 100) + '%';
  ui.hpYouNum.textContent = Math.ceil(player.hp);
  ui.hpBotNum.textContent = Math.ceil(bot.hp);
  const eWhole = Math.floor(player.energy + 1e-6);
  if (ui.energyNum.textContent !== String(eWhole)) ui.energyNum.textContent = eWhole;
  const ePaused = player.firing || (player.gunOn && !player.gunDry && ready(player, 'gatling'));
  const eRate = '+' + +(ePaused ? 0 : CFG.energyRegen * (1 + CFG.reactorBonus * (player.reactors || 0))).toFixed(2) + '/s';
  if (ui.energyRate.textContent !== eRate) ui.energyRate.textContent = eRate;
  ui.energyIcon.style.setProperty('--f', (player.energy - eWhole).toFixed(2));    // progress toward the next point
  // Buttons: grey when unusable; while on cooldown the ring refills to show the time left
  const setBtn = (b, id, blocked) => {
    const cd = player.cdl[id] || 0;
    b.el.classList.toggle('dim', blocked || cd > 0);
    b.knob.style.setProperty('--p', cd > 0 ? (1 - cd / CFG.cooldown[id]).toFixed(3) : blocked ? 0 : 1);
  };
  setBtn(laserStick, 'laser', player.energy < CFG.laserCost || !!player.burst);
  setBtn(flameStick, 'flame', !player.firing && (player.fireDry || player.energy < CFG.flameMinStart));
  setBtn(slamBtn, 'slam', player.energy < CFG.slamCost || player.slamCd > 0);
  setBtn(shieldBtn, 'shield', player.energy < CFG.shieldCost);
  setBtn(mortarStick, 'mortar', player.energy < CFG.mortarCost);
  setBtn(mineBtn, 'mine', player.energy < CFG.mineCost);
  setBtn(turretBtn, 'turret', player.energy < CFG.turretCost);
  setBtn(pistolBtn, 'pistol', player.energy < CFG.pistolCost);
  setBtn(railBtn, 'rail', player.energy < CFG.railCost);
  setBtn(shotgunBtn, 'shotgun', player.energy < CFG.shotgunCost);
  setBtn(pusherBtn, 'pusher', player.energy < CFG.pusherCost);
  setBtn(hookBtn, 'hook', player.energy < CFG.hookCost);
  setBtn(gatlingStick, 'gatling', player.gunDry || (!gatlingStick.held && player.energy < CFG.gatlingCost));
  // Mortar aim preview: arc dots + blast zone at the landing point
  const aimM = state === 'playing' && mortarStick.held && mortarStick.mag > 0;
  aimDisc.visible = aimM;
  if (aimM) {
    const t = mortarTarget(player, mortarStick.x, mortarStick.y, mortarRange(mortarStick.mag));
    aimDisc.position.x = t.x; aimDisc.position.z = t.z; aimDisc.scale.setScalar(CFG.mortarRadius);
    arcDots.forEach((d, i) => { const k = (i + 1) / (arcDots.length + 1);
      d.position.set(player.x + (t.x - player.x) * k, arcY(k), player.z + (t.z - player.z) * k); });
  }
  for (const d of arcDots) d.visible = aimM;
  thrustStick.knob.style.setProperty('--p', player.charge.toFixed(3));
  thrustStick.el.classList.toggle('dim', player.charge < CFG.thrustMinStart && !player.thrusting);
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'playing') {
    const sgn = CFG.thrustInvert ? -1 : 1;
    player.thrust = CFG.thrustersEnabled && thrustStick.held && thrustStick.mag > 0
      ? { x: thrustStick.x * sgn, z: thrustStick.y * sgn, mag: thrustStick.mag } : null;
    player.fireOn = flameStick.held;
    player.fireDir = flameStick.mag > 0 ? { x: flameStick.x, z: flameStick.y } : null;
    player.gunOn = gatlingStick.held;
    player.gunDir = gatlingStick.mag > 0 ? { x: gatlingStick.x, z: gatlingStick.y } : null;
    botThink(dt);
    stepRobot(player, dt); stepRobot(bot, dt);
    collideRobots(); collideTurrets();
    stepLasers(dt); stepHooks(dt); stepShells(dt); stepMines(dt, now / 1000); stepTurrets(dt, now / 1000);
    if (player.hp <= 0 || bot.hp <= 0) endRound(bot.hp <= 0 ? 'you' : 'bot', now);
  }
  stepPuffs(dt); stepRings(dt);
  syncVisuals(now / 1000);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);

// Debug handle for tuning from the console
window.RoBotFight = { CFG, player, bot, lasers, get state() { return state; }, get draft() { return draft; }, hooks, get match() { return match; }, get noAim() { return noAim; }, mines, turrets, shells };
})();
</script>
</body>
</html>
