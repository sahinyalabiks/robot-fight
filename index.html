<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e9edf3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>RoBot Fight</title>
<style>
  :root { --blue:#2f7df6; --red:#f0443e; --bg:#e9edf3; --ink:#2a3342; --muted:#c9d1dc; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#d5dbe4; overflow:hidden; overscroll-behavior:none;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--ink);
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
  #app { position:relative; height:100%; width:100%; max-width:calc(100vh * 0.6); margin:0 auto;
    background:var(--bg); display:flex; flex-direction:column; overflow:hidden; touch-action:none; }
  @media (pointer:coarse), (max-width:600px) { #app { max-width:none; } html, body { background:var(--bg); } }

  /* HUD */
  #hud { flex:0 0 auto; height:calc(40px + env(safe-area-inset-top)); padding:calc(8px + env(safe-area-inset-top)) 14px 0;
    display:flex; gap:12px; align-items:center; font-size:11px; font-weight:700; letter-spacing:.08em; }
  .hp { flex:1; display:flex; align-items:center; gap:8px; }
  .hp.bot { flex-direction:row-reverse; }
  .hp .bar { position:relative; flex:1; height:18px; border-radius:9px; background:var(--muted); overflow:hidden; }
  .hp .fill { height:100%; width:100%; border-radius:9px; transition:width .12s linear; }
  .hp .num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900;
    letter-spacing:.02em; color:#fff; -webkit-text-stroke:3px #1c2533; paint-order:stroke fill; }
  .hp.you .fill { background:var(--blue); }
  .hp.bot .fill { background:var(--red); margin-left:auto; }
  #hud2 { flex:0 0 auto; height:26px; padding:0 14px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .loadout { flex:1; display:flex; gap:3px; align-items:center; min-width:0; }
  .loadout.right { justify-content:flex-end; }
  .mini { width:20px; height:20px; border-radius:50%; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--n1), var(--n2)); box-shadow:0 1px 2px rgba(40,60,90,.25); }
  .mini svg { width:13px; height:13px; }
  .loadout.many { gap:2px; } .loadout.many .mini { width:15px; height:15px; } .loadout.many .mini svg { width:10px; height:10px; }
  #score { flex:0 0 auto; display:flex; align-items:center; gap:7px; font-size:11px; font-weight:900; letter-spacing:.08em; color:#6b778a; }
  .pips { display:flex; gap:3px; }
  .pips i { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .pips.you i.on { background:var(--blue); } .pips.bot i.on { background:var(--red); }
  #score .pips { font-size:15px; letter-spacing:0; } #score .pips.you { color:var(--blue); } #score .pips.bot { color:var(--red); }
  #hud2 .loadout { flex:1 1 0; overflow:hidden; }

  /* Arena viewport */
  #stage { flex:0 1 var(--stageH, 100%); position:relative; min-height:0; touch-action:none; }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* Rising damage numbers */
  .dmg { position:absolute; z-index:3; pointer-events:none; font-weight:900; color:#ffd60a; line-height:1;
    -webkit-text-stroke:4px #000; paint-order:stroke fill; transform:translate(-50%,-50%);
    animation:dmgRise .85s ease-out forwards; }
  @keyframes dmgRise {
    0% { transform:translate(-50%,-50%) scale(.6); opacity:1; }
    15% { transform:translate(-50%,-90%) scale(1.15); opacity:1; }
    70% { opacity:1; }
    100% { transform:translate(-50%,-320%) scale(1); opacity:0; }
  }

  /* Controls panel: the ability buttons are only cooldown readouts now (pushed up against the arena);
     the rest of the panel is the joystick's space */
  #controls { --bs:52px; flex:1 0 calc(104px + env(safe-area-inset-bottom)); position:relative; padding:0 6px env(safe-area-inset-bottom); background:var(--bg); touch-action:none; }
  #btnRow { position:relative; z-index:2; margin-top:-5px; padding-left:4px; display:flex; justify-content:flex-start; align-items:flex-start; flex-wrap:wrap; gap:6px 6px; pointer-events:none; }
  .ability { position:relative; width:var(--bs); height:var(--bs); display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .ability .knob { --p:1; position:relative; width:calc(var(--bs) - 2px); height:calc(var(--bs) - 2px); border-radius:50%;
    background:conic-gradient(var(--ink) calc(var(--p) * 360deg), var(--muted) 0);
    display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(40,60,90,.2); transition:transform .06s; }
  .ability .knob::before { content:""; position:absolute; inset:5px; border-radius:50%; background:linear-gradient(160deg, var(--n1, #fff), var(--n2, #fff)); }
  .ability .knob svg { position:relative; width:calc(var(--bs) * .46); height:calc(var(--bs) * .46); }
  .ability .knob span { display:none; }
  .ability.pressed .knob { transform:scale(.86); }
  .ability .cd { position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); z-index:1; display:flex; align-items:center;
    height:16px; padding:0 6px; border-radius:9px; background:#5b6b82; border:2px solid var(--bg); color:#fff; font-size:10px; font-weight:900; white-space:nowrap; }
  .ability.dim .knob { box-shadow:none; }
  .ability.dim .knob::before, .ability.dim .knob svg { filter:grayscale(1); opacity:.5; }
  .ability .left { position:absolute; inset:0; z-index:2; display:none; align-items:center; justify-content:center; font-size:15px; font-weight:900; color:#fff;
    -webkit-text-stroke:3px #1c2533; paint-order:stroke fill; }
  .ability.dim .left { display:flex; }

  /* Floating joystick: rests in the middle of the controls panel, jumps to wherever the thumb lands */
  #joy { position:fixed; left:0; top:0; width:116px; height:116px; margin:-58px 0 0 -58px; border-radius:50%; z-index:5; pointer-events:none;
    background:rgba(47,125,246,.08); border:2px solid rgba(47,125,246,.28); opacity:.5; transition:opacity .1s; }
  #joy.on { opacity:1; background:rgba(47,125,246,.12); }
  #joyKnob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%;
    background:rgba(47,125,246,.6); box-shadow:0 3px 8px rgba(40,60,90,.25); }

  /* Test toggle: bot chases the player relentlessly */
  #chaseRow { position:absolute; left:10px; bottom:calc(8px + env(safe-area-inset-bottom)); z-index:6; display:flex; align-items:center; gap:6px;
    padding:3px 10px 3px 6px; border-radius:10px; background:rgba(255,255,255,.75); font-size:11px; touch-action:manipulation; }
  #chaseRow input { position:absolute; opacity:0; pointer-events:none; }
  #chaseRow .box { width:16px; height:16px; border-radius:6px; border:2.5px solid #9aa6b6; background:#fff; display:flex; align-items:center; justify-content:center; }
  #chaseRow input:checked + .box { background:var(--red); border-color:var(--red); }
  #chaseRow input:checked + .box::after { content:""; width:3px; height:7px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:translateY(-1px) rotate(45deg); }
  #chaseRow b { font-weight:900; letter-spacing:.02em; }

  /* Draft screen: a handful of big cards, one tap picks */
  #draft { position:absolute; inset:0; z-index:9; background:var(--bg); display:flex; flex-direction:column; align-items:stretch;
    padding:calc(12px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom)); gap:6px; overflow:hidden; }
  #draft.hidden { display:none; }
  #draft { background:linear-gradient(180deg, #fbe9e8 0, var(--bg) 22%, var(--bg) 78%, #e3eeff 100%); }
  .side { flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:7px 12px 7px 8px; border-radius:16px; background:#fff;
    box-shadow:0 2px 8px rgba(40,60,90,.12); border:2.5px solid transparent; transition:border-color .15s, box-shadow .15s; }
  .side .av { width:56px; height:46px; flex:0 0 auto; } .side .av svg { width:100%; height:100%; display:block; }
  .side .info { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }
  .side .nm { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:900; letter-spacing:.1em; }
  .side.bot .nm { color:var(--red); } .side.you .nm { color:var(--blue); }
  .side .nm .tag { margin-left:auto; font-size:9px; letter-spacing:.08em; color:#fff; border-radius:7px; padding:2px 7px; opacity:0; transition:opacity .15s; }
  .side.bot .tag { background:var(--red); } .side.you .tag { background:var(--blue); }
  .side.turn .tag { opacity:1; }
  .side.bot.turn { border-color:var(--red); box-shadow:0 0 0 4px rgba(240,68,62,.15); }
  .side.you.turn { border-color:var(--blue); box-shadow:0 0 0 4px rgba(47,125,246,.15); }
  .side .loadout { min-height:26px; gap:4px; }
  .side .mini { width:26px; height:26px; } .side .mini svg { width:17px; height:17px; }
  .side .loadout.many .mini { width:21px; height:21px; } .side .loadout.many .mini svg { width:14px; height:14px; }
  .side .none { font-size:11px; font-weight:600; color:#9aa6b6; }
  #draftHead { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:1px; margin-top:2px; }
  #draftHead .top { display:flex; align-items:baseline; gap:8px; }
  #draft h2 { margin:0; font-size:20px; letter-spacing:.06em; }
  #draftGoal { font-size:10px; font-weight:900; letter-spacing:.1em; color:#8a96a8; }
  #draft p { margin:0; text-align:center; }
  #draftStatus { min-height:19px; font-size:14px; color:var(--ink); font-weight:800; letter-spacing:.03em; }
  #cards { flex:1 1 auto; min-height:0; overflow-y:auto; touch-action:pan-y; display:grid; grid-template-columns:1fr 1fr;
    gap:13px 12px; align-content:center; padding:10px 8px 6px; }
  .n-weapon { --n1:#ffb866; --n2:#f2711c; --nb:#d85a0a; }
  .n-enhancement { --n1:#63e2d1; --n2:#12a594; --nb:#0b8577; }
  .n-deployable { --n1:#f9a3d6; --n2:#d6409f; --nb:#b02a80; }
  .card { position:relative; background:#fff; border:3px solid var(--nb); border-radius:13px; padding-bottom:7px;
    box-shadow:0 3px 0 var(--nb), 0 5px 9px rgba(40,60,90,.16); transition:transform .08s; }
  .card:last-child:nth-child(odd) { grid-column:1 / -1; width:calc(50% - 6px); justify-self:center; }
  #cards.myturn .card:not(.taken):active { transform:scale(.96); }
  .card .art { height:46px; border-radius:9px 9px 0 0; background:linear-gradient(160deg, var(--n1), var(--n2));
    display:flex; align-items:center; justify-content:center; }
  .card .art svg { width:38px; height:38px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.18)); }
  .card .name { text-align:center; font-size:15px; font-weight:900; letter-spacing:.03em; margin:5px 2px 4px; }
  .card .tags { display:flex; justify-content:center; gap:3px; flex-wrap:wrap; padding:0 3px; }
  .card .desc { font-size:11.5px; line-height:1.3; color:#536074; text-align:center; padding:5px 8px 0; }
  .chip { font-size:8.5px; font-weight:800; letter-spacing:.06em; border-radius:6px; padding:2px 5px; background:#e8edf4; color:#5b6b82; white-space:nowrap; }
  .chip.nat { background:var(--n2); color:#fff; }
  .card .badge { position:absolute; top:-9px; left:-8px; min-width:28px; height:28px; padding:0 7px; border-radius:14px; background:#5b6b82;
    border:2.5px solid #fff; box-shadow:0 2px 4px rgba(30,40,60,.35); color:#fff; font-size:13px; font-weight:900;
    display:flex; align-items:center; justify-content:center; white-space:nowrap; }
  .card .badge small { font-size:9px; font-weight:800; margin-left:1px; }
  .card .owner { display:none; position:absolute; top:16px; left:50%; transform:translateX(-50%) rotate(-7deg); font-size:14px; font-weight:900;
    letter-spacing:.1em; color:#fff; border-radius:8px; padding:2px 12px; border:2px solid #fff; z-index:1; }
  .card.taken .owner { display:block; }
  .card.taken .art, .card.taken .name, .card.taken .tags, .card.taken .badge, .card.taken .desc { opacity:.35; filter:grayscale(.8); }
  .card.mine { border-color:var(--blue); box-shadow:0 3px 0 var(--blue); } .card.mine .owner { background:var(--blue); }
  .card.theirs { border-color:var(--red); box-shadow:0 3px 0 var(--red); } .card.theirs .owner { background:var(--red); }

  /* Overlay */
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(233,237,243,.82); z-index:10; text-align:center; gap:10px; touch-action:manipulation; }
  #overlay.hidden { display:none; }
  #overlay h1 { margin:0; font-size:36px; letter-spacing:.04em; }
  #overlay p { white-space:pre-line; line-height:1.6; margin:0; font-size:14px; font-weight:600; color:#6b778a; letter-spacing:.06em; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hp you"><span>YOU</span><div class="bar"><div class="fill" id="hpYou"></div><span class="num" id="hpYouNum"></span></div></div>
    <div class="hp bot"><span>BOT</span><div class="bar"><div class="fill" id="hpBot"></div><span class="num" id="hpBotNum"></span></div></div>
  </div>
  <div id="hud2">
    <div class="loadout" id="loadYou"></div>
    <div id="score"><span class="pips you" id="pipsYou"></span><span id="roundLbl">ROUND 1</span><span class="pips bot" id="pipsBot"></span></div>
    <div class="loadout right" id="loadBot"></div>
  </div>
  <div id="stage"></div>
  <div id="controls">
    <div id="btnRow">
      <div class="ability" id="btnFlame"><div class="knob"></div></div>
      <div class="ability" id="btnSlam"><div class="knob"></div></div>
      <div class="ability" id="btnShield"><div class="knob"></div></div>
      <div class="ability" id="btnMine"><div class="knob"></div></div>
      <div class="ability" id="btnTurret"><div class="knob"></div></div>
      <div class="ability" id="btnShotgun"><div class="knob"></div></div>
      <div class="ability" id="btnPusher"><div class="knob"></div></div>
      <div class="ability" id="btnHook"><div class="knob"></div></div>
      <div class="ability" id="btnPistol"><div class="knob"></div></div>
      <div class="ability" id="btnRail"><div class="knob"></div></div>
      <div class="ability" id="btnGatling"><div class="knob"></div></div>
      <div class="ability" id="btnMortar"><div class="knob"></div></div>
      <div class="ability" id="btnLaser"><div class="knob"></div></div>
    </div>
  </div>
  <label id="chaseRow"><input type="checkbox" id="chaseBox"><span class="box"></span><b>BotChaseOn</b></label>
  <div id="joy"><div id="joyKnob"></div></div>
  <div id="draft" class="hidden">
    <div class="side bot">
      <div class="av" id="avBot"></div>
      <div class="info">
        <div class="nm">BOT <span class="pips bot" id="dPipsBot"></span><span class="tag">PICKING</span></div>
        <div class="loadout" id="dLoadBot"></div>
      </div>
    </div>
    <div id="draftHead">
      <div class="top"><h2 id="draftTitle">ROUND 1</h2><span id="draftGoal"></span></div>
      <p id="draftStatus"></p>
    </div>
    <div id="cards"></div>
    <div class="side you">
      <div class="av" id="avYou"></div>
      <div class="info">
        <div class="nm">YOU <span class="pips you" id="dPipsYou"></span><span class="tag">YOUR PICK</span></div>
        <div class="loadout" id="dLoadYou"></div>
      </div>
    </div>
  </div>
  <div id="overlay"><h1 id="ovTitle">ROBOT FIGHT</h1><p id="ovSub">DRAG TO MOVE · ABILITIES AUTO-FIRE
TAP TO START</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

// ---------- Tuning ----------
// Joystick prototype: you steer, abilities fire on their own when their condition is met and their cooldown is ready.
// No energy any more: the cooldown is the only limiter, so each cooldown below is balanced against the ability's damage.
const CFG = {
  arenaW: 10, arenaD: 20, wallH: 0.6, wallT: 0.4,
  robotR: 0.75, robotH: 0.55,
  // Ship-style movement: the stick is engine thrust, not a velocity. Momentum carries you, drag caps the speed,
  // and changing direction takes a moment. Top speed = thrust / drag; it takes about 1/drag seconds to get there or to turn.
  thrust: 6,                // acceleration at full stick (units/s^2)
  drag: 1.8,                // velocity bleeds off at this rate (1/s)
  wallBounce: 0.3,          // share of your incoming speed that comes back off a wall...
  wallKick: 3.5,            // ...plus this much extra push from the wall itself (the wall shoves you back)
  wallCd: 0.3,              // a robot grazing or pressing on a wall is shoved at most this often
  wallAnim: 0.3, wallPunch: 0.6,   // the wall visibly punches inward by up to this many units, then returns, over this many seconds
  robotBounce: 4.5,         // when the two robots collide, each is pushed away from the other at this extra speed
  hitLock: 0.5,             // after a wall or robot bump the stick is ignored for this long, so the deflection is not fought by your own input
  bumpCd: 0.35,             // at most one bump per this many seconds
  startDelay: 1.5,          // every ability starts the round on this cooldown, so nobody opens with a full volley
  maxHp: 100,
  // Cooldown (seconds) per ability. Balanced by measurement: scripted duels where an attacker holds each weapon's preferred range
  // against a jinking target (damage per second, whole fight): rail 3.0, repeater 1.6 up close and 3.2 from 8.5+ units (it splits at 7.5), gatling 3.1, pistol 2.3, flamer 4.0, shotgun 4.0,
  // slam 3.8, mortar 3.4 (about 1.2 against a bot that steps out of its zones), turret 3.2, mine 2.0, pusher 1.7 and hook 1.2 (those two are utility).
  // Guaranteed long-range sits at 3, weapons with spread or slow shots a little under, close-range ones about a third higher.
  cooldown: { laser: 3, flame: 4, slam: 7, shield: 12, mortar: 6, gatling: 4, mine: 5, turret: 9, rail: 5, shotgun: 4.5, pusher: 6, hook: 7, pistol: 3 },
  // Repeater: one bolt at the enemy's current position (no lead). After laserSplit units it splits into laserLanes bolts side by side:
  // a single hit up close, several at range.
  laserSpeed: 12, laserDamage: 5, laserLen: 0.9, laserRange: 12,
  laserSplit: 7.5,          // the bolt flies as ONE shot for this far (5 robot widths), then splits
  laserLanes: 5, laserWidth: 3,   // ...into this many parallel bolts, spread across this total width (2 robot widths)
  // Flamer: burns for a few seconds while the enemy is in reach, then recharges
  flameRange: 3.2, flameHalfAngle: 16, flameDps: 10, flameDuration: 3,
  // Gatling: streams bullets for a couple of seconds while the enemy is within range
  gatlingRate: 4, gatlingDamage: 3, gatlingSpeed: 14, gatlingLead: 0.5, gatlingSpread: 12, gatlingDuration: 2, gatlingRange: 12,
  // Slam: hops when the enemy is about to be under the landing spot
  slamDamage: 30, slamRadius: 2.5, slamTime: 0.5, slamHeight: 1.3, slamSettle: 0.4, slamKnock: 3,
  // Shield: pops by itself when a meaningful hit is about to land
  shieldTime: 3, shieldThreat: 8,
  // Mortar: lobbed at where the enemy is heading
  mortarDamage: 22, mortarRadius: 3.2, mortarFlight: 1.5, mortarHeight: 4, mortarMinRange: 2.5, mortarMaxRange: 12,
  // Mine: dropped under you when the enemy is near
  mineDamage: 20, mineSlow: 0.5, mineSlowTime: 4, mineArm: 1, mineTrigger: 0.45, mineRange: 7, mineMax: 3,
  // Turret: dropped under you when the enemy is within range
  turretDamage: 3, turretLife: 8, turretInterval: 0.75, turretRadius: 0.42, turretSpread: 6, turretRange: 10, turretMax: 2,
  // Spikes: contact hurts the other robot, at most once per interval
  spikesDamage: 6, spikesInterval: 0.8, spikesKnock: 1.5,
  // Railgun
  railDamage: 15, railSpeed: 60, railRange: 14,
  // Pistol
  pistolDamage: 7, pistolSpeed: 14, pistolRange: 11,
  // Shotgun: aimed at where the enemy is right now, so it wants close range
  shotgunPellets: 5, shotgunAngle: 5, shotgunDamage: 4, shotgunSpeed: 13, shotgunRange: 6,
  // Pusher: shoves the enemy away
  pusherDamage: 10, pusherSpeed: 30, pusherKnock: 4, pusherRange: 5.5,
  // Hook: yanks the enemy toward you
  hookDamage: 8, hookSpeed: 20, hookTug: 0.45, hookPull: 4, hookMin: 4.5, hookRange: 10,
  // Passives
  armorReduce: 1, ricochetBounces: 2, deflectChance: 0.25, speedBonus: 0.15, durabilityBonus: 0.15,
  overclockBonus: 0.12,     // per Overclock owned: abilities recharge this much faster (stacks)
  // speedBonus and durabilityBonus above also stack: each copy adds this much again
  stackable: ['overclock', 'speed', 'durability'],   // these can be drafted again and again; each card can still only be taken by one side per draft
  // Match
  roundsToWin: 5, draftOptions: 5,
  notInRound1: ['slam', 'pusher', 'hook', 'pistol'],
  camElevation: 58
};
const BLUE = 0x2f7df6, RED = 0xf0443e;

// ---------- Scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0xe9edf3);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
{
  const a = CFG.camElevation * Math.PI / 180;
  camera.position.set(0, 30 * Math.sin(a), 30 * Math.cos(a));
  camera.lookAt(0, 0, 0);
  camera.updateMatrixWorld(true);
}

scene.add(new THREE.HemisphereLight(0xffffff, 0xcfd6e0, 0.7));

// Fit the whole arena (incl. walls) inside the stage, whatever its aspect ratio
function fitCamera() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  const inv = camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const v = new THREE.Vector3(), ex = HW + CFG.wallT, ez = HD + CFG.wallT;
  for (const x of [-ex, ex]) for (const y of [0, CFG.wallH]) for (const z of [-ez, ez]) {
    v.set(x, y, z).applyMatrix4(inv);
    minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x);
    minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  let hw = (maxX - minX) / 2 * 1.05, hh = (maxY - minY) / 2 * 1.012;
  const app = document.getElementById('app');
  app.style.setProperty('--stageH', Math.ceil(app.clientWidth * hh / hw) + 'px');
  const aspect = w / h;
  if (hw / hh > aspect) hh = hw / aspect; else hw = hh * aspect;
  camera.left = cx - hw; camera.right = cx + hw; camera.top = cy + hh; camera.bottom = cy - hh;
  camera.updateProjectionMatrix();
  placeJoy();
}
new ResizeObserver(fitCamera).observe(stage);

function wallPunch(idx, speed) { const w = walls[idx]; w.t = 0; w.amp = Math.min(CFG.wallPunch, 0.25 + speed * 0.08); }
function stepWalls(dt) {
  for (const w of walls) {
    if (w.t < 0) continue;
    w.t += dt; const k = w.t / CFG.wallAnim;
    let off = 0;
    if (k >= 1) w.t = -1;
    else off = w.amp * (k < 0.2 ? Math.sin(k / 0.2 * Math.PI / 2) : 0.5 * (1 + Math.cos((k - 0.2) / 0.8 * Math.PI)));   // quick punch out, slower settle back
    w.m.position.set(w.bx + w.nx * off, CFG.wallH / 2, w.bz + w.nz * off);
  }
}

}

// Where a robot will be in t seconds if it keeps its current velocity (kept inside the arena)
const clampX = x => Math.max(-(HW - CFG.robotR), Math.min(HW - CFG.robotR, x));
const clampZ = z => Math.max(-(HD - CFG.robotR), Math.min(HD - CFG.robotR, z));
function predictPos(r, t) { return { x: clampX(r.x + r.vx * t), z: clampZ(r.z + r.vz * t) }; }
// Knockback: moves the robot about `dist` units in direction (nx, nz), fading out smoothly
function knock(e, nx, nz, dist) { const v = dist * CFG.drag; e.vx += nx * v; e.vz += nz * v; }   // an impulse: coasts about `dist` units under drag
// Unit direction from r to its enemy. With a projectile speed it leads the target.
function aimAt(r, leadSpeed, leadEff) {
  const e = enemyOf(r); let tx = e.x, tz = e.z;
  if (leadSpeed) for (let i = 0; i < 2; i++) { const f = predictPos(e, Math.hypot(tx - r.x, tz - r.z) / leadSpeed); tx = f.x; tz = f.z; }
  if (leadEff !== undefined) { tx = e.x + (tx - e.x) * leadEff; tz = e.z + (tz - e.z) * leadEff; }
  const l = Math.hypot(tx - r.x, tz - r.z) || 1;
  return { x: (tx - r.x) / l, z: (tz - r.z) / l };
}

  el.style.top = ((1 - projV.y) / 2 * stage.clientHeight) + 'px';

const turretBaseGeo = new THREE.CylinderGeometry(0.34, 0.4, 0.5, 16), turretBarrelGeo = new THREE.BoxGeometry(0.14, 0.14, 0.6);

  const m = new THREE.Mesh(turretBaseGeo, new THREE.MeshLambertMaterial({ color: r.color })); m.castShadow = true;
  const barrel = new THREE.Mesh(turretBarrelGeo, new THREE.MeshLambertMaterial({ color: 0x3a4252 })); barrel.position.y = 0.2; m.add(barrel);

}
function collideTurrets() {

    if (d >= min) { t.solidFor.add(r); continue; }

// ---------- Mortar ----------
const shellGeo = new THREE.SphereGeometry(0.3, 16, 12);
const discGeo = new THREE.CircleGeometry(1, 48); discGeo.rotateX(-Math.PI / 2);
const shells = [];
const lockShape = new THREE.Shape(); lockShape.moveTo(0, 0.55); lockShape.lineTo(-0.42, -0.35); lockShape.lineTo(0, -0.12); lockShape.lineTo(0.42, -0.35); lockShape.closePath();

function tryMortar(r, tx, tz) {

  startCd(r, 'mortar');
  const R = CFG.mortarRadius;
  const m = new THREE.Mesh(shellGeo, new THREE.MeshLambertMaterial({ color: r.color })); m.castShadow = true;
  const mark = new THREE.Mesh(discGeo, new THREE.MeshBasicMaterial({ color: r.color, transparent: true, opacity: 0.15, depthWrite: false }));

  scene.add(m); scene.add(mark);

  for (let i = 0; i < 4; i++) { const a = new THREE.Mesh(lockGeo, lockMats[r.isPlayer]); a.rotation.y = i * Math.PI / 2 + Math.PI / 4; lock.add(a); }

}
function removeShell(s) { scene.remove(s.m); scene.remove(s.mark); scene.remove(s.lock); s.m.material.dispose(); s.mark.material.dispose(); }
function stepShells(dt) {
  for (let i = shells.length - 1; i >= 0; i--) {
    const s = shells[i]; s.t += dt; const k = s.t / CFG.mortarFlight;
    if (k < 1) {
      s.m.position.set(s.sx + (s.tx - s.sx) * k, arcY(k), s.sz + (s.tz - s.sz) * k);
      s.mark.material.opacity = 0.12 + 0.2 * k;

// ---------- Hook ----------
const hookHeadGeo = new THREE.ConeGeometry(0.2, 0.55, 8); hookHeadGeo.rotateX(Math.PI / 2);

function startHook(r) {

  head.rotation.y = Math.atan2(d.x, d.z); scene.add(head);

        for (const t of turrets) if (Math.hypot(t.x - h.x, t.z - h.z) < CFG.turretRadius + 0.15) dead = true;
        if (!dead && Math.hypot(e.x - h.x, e.z - h.z) < CFG.robotR + 0.25) {

// ---------- Auto-fire: every ability has a condition; when it holds and the cooldown is ready, it fires ----------
// The same rules run for the player and for the bot.
function threatScore(r) {

  if (e.slamT >= 0 && gap < CFG.slamRadius * 1.3) score += CFG.slamDamage;
  for (const s of shells)
    if (s.owner === e && s.t > CFG.mortarFlight * 0.6 && Math.hypot(r.x - s.tx, r.z - s.tz) < s.R + 1.2) score += CFG.mortarDamage;

// ---------- Bot movement: keeps the range its weapons like, strafes, dodges shots, stays off the walls ----------
const ai = { think: 0, ix: 0, iz: 0, dir: 1, dirT: 0, loop: 1, loopT: 0, primary: null, primaryT: 0, mode: '' };
// How much each weapon is worth (about its measured damage per second), and the distance it likes. Passives and deployables do not set the range.
const DPSW = { rail: 3, pistol: 2.3, laser: 3, gatling: 3.1, flame: 4, shotgun: 4, slam: 3.8, mortar: 3.4, pusher: 1.7, hook: 1.2 };
const PREF = { flame: 2.6, shotgun: 3.6, slam: 1.6, pusher: 4.5, hook: 6, laser: 9.5, gatling: 6.5, pistol: 6, rail: 8.5, mortar: 8.5 };
// Distances inside which an enemy ability hurts (used to decide how far to stay while it is ready)
const DANGER = { flame: 4.3, shotgun: 6, slam: 3.2 };
const chaseBox = document.getElementById('chaseBox');
const chaseRow = document.getElementById('chaseRow');
chaseRow.addEventListener('pointerdown', e => e.stopPropagation());      // tapping the toggle must not start the joystick
let botOverride = null;        // test hook
const botFlags = { kick: true, ram: true };      // test hooks: switch the pinned-escape tricks off
function botInput(dt) {
  if (botOverride) return botOverride();
  if (chaseBox.checked) {                           // BotChaseOn: full thrust straight at the player, no strafing, no dodging
    const dx = player.x - bot.x, dz = player.z - bot.z, g = Math.hypot(dx, dz) || 1;
    ai.ix = dx / g; ai.iz = dz / g;
    return { x: ai.ix, z: ai.iz };
  }
  ai.think -= dt;
  if (ai.think > 0) return { x: ai.ix, z: ai.iz };

}
// readiness of an ability in the next second or so: 1 ready, 0.6 almost, 0.15 far

function botThink(me, foe, S, dtThink) {

  const mxm = HW - CFG.robotR, mzm = HD - CFG.robotR;

  // 1 + 3: pick the range from the abilities that are (nearly) ready, committing for a moment so it does not flip-flop
  S.primaryT -= dtThink;

  let danger = 0;

  // 3: cooldown / HP awareness

  const myFrac = me.hp / me.maxHp, foeFrac = foe.hp / foe.maxHp;

  for (const s of lasers) {                                                               // sidestep incoming shots
    if (s.owner !== foe || Math.random() > 0.65) continue;
    const rx = me.x - s.x, rz = me.z - s.z, sp = Math.hypot(s.vx, s.vz), vxn = s.vx / sp, vzn = s.vz / sp;

  }

}

    r.gunHot = false; r.gunLeft = 0; r.gunT = 0; r.gunOn = false; r.fireOn = false; r.firing = false; r.flameLeft = 0; r.fireAcc = 0;
    r.slowT = 0; r.wallCd = 0; r.lockT = 0; r.dmgAcc = 0; r.shieldT = 0; r.shieldScan = 0; r.spikeCd = 0; r.burst = null; r.flash = 0;

    r.cdl = {}; for (const id of r.abilities) if (CFG.cooldown[id] > 0) r.cdl[id] = CFG.startDelay;
    r.x = 0; r.z = r.isPlayer ? HD * 0.55 : -HD * 0.55;
    r.maxHp = Math.round(CFG.maxHp * (1 + CFG.durabilityBonus * stacks(r, 'durability')));
    r.hp = r.maxHp;
  }
  ai.think = 0; ai.ix = ai.iz = 0; bumpT = 0;
  for (const w of walls) { w.t = -1; w.m.position.set(w.bx, CFG.wallH / 2, w.bz); }
}

function stepRobot(r, dt, ix, iz) {
  // Steering: the stick pushes (thrust), drag pulls back; speed passive / mine slow scale the thrust, and so the top speed
  const th = CFG.thrust * (1 + CFG.speedBonus * stacks(r, 'speed')) * (r.slowT > 0 ? CFG.mineSlow : 1);
  if (r.lockT <= 0) { r.vx += ix * th * dt; r.vz += iz * th * dt; }      // just bumped or hit a wall: stick ignored until the lock runs out

  const dg = Math.exp(-CFG.drag * dt); r.vx *= dg; r.vz *= dg;
  r.slowT = Math.max(0, r.slowT - dt); r.spikeCd = Math.max(0, r.spikeCd - dt);
  r.x += r.vx * dt; r.z += r.vz * dt;
  const mx = HW - CFG.robotR, mz = HD - CFG.robotR;
  r.wallCd = Math.max(0, r.wallCd - dt); r.lockT = Math.max(0, r.lockT - dt);
  // Walls shove back: the incoming speed partly returns, plus a fixed kick from the wall; the wall itself punches inward (animated)
  const hitWall = (idx, nx, nz) => {
    const vn = r.vx * nx + r.vz * nz;               // speed along the inward normal (negative = still heading into the wall)
    if (r.wallCd <= 0) {
      const out = Math.max(vn, Math.max(0, -vn) * CFG.wallBounce + CFG.wallKick);
      r.vx += nx * (out - vn); r.vz += nz * (out - vn);
      r.wallCd = CFG.wallCd; r.lockT = CFG.hitLock; wallPunch(idx, Math.max(0, -vn));
    } else if (vn < 0) { r.vx -= nx * vn; r.vz -= nz * vn; }
  };
  if (r.x > mx) { r.x = mx; hitWall(3, -1, 0); } else if (r.x < -mx) { r.x = -mx; hitWall(2, 1, 0); }
  if (r.z > mz) { r.z = mz; hitWall(1, 0, -1); } else if (r.z < -mz) { r.z = -mz; hitWall(0, 0, 1); }

  const cr = cdRate(r);
  for (const id in r.cdl) r.cdl[id] = Math.max(0, r.cdl[id] - dt * cr);

  // Flamer: ignites when the enemy is in reach and it is ready, then burns for the full flameDuration, then recharges
  if (r.firing) {
    r.flameLeft -= dt;
    if (r.flameLeft <= 0) { r.firing = false; startCd(r, 'flame'); }        // once lit it burns its full duration, whatever the range
  } else if (r.fireOn && ready(r, 'flame')) { r.firing = true; r.flameLeft = CFG.flameDuration; }
  if (r.firing) {
    const e = enemyOf(r), l = Math.hypot(e.x - r.x, e.z - r.z) || 1, d = { x: (e.x - r.x) / l, z: (e.z - r.z) / l };
    for (r.fireAcc += dt * 80; r.fireAcc >= 1; r.fireAcc--) spawnPuff(r, d.x, d.z);
    const rx = e.x - r.x, rz = e.z - r.z, along = rx * d.x + rz * d.z, side = Math.abs(rx * d.z - rz * d.x), reach = along - CFG.robotR;
    if (e.shieldT <= 0 && along > 0 && reach < CFG.flameRange + CFG.robotR &&
        side < CFG.robotR + Math.max(0, reach) * Math.tan(CFG.flameHalfAngle * Math.PI / 180)) hurt(e, CFG.flameDps * dt, 0.5, true);
  }
  // Gatling: streams for gatlingDuration while the enemy is in range, then recharges
  r.gunT = Math.max(0, r.gunT - dt);
  if (r.gunHot) {
    r.gunLeft -= dt;
    if (!r.gunOn || r.gunLeft <= 0) { r.gunHot = false; startCd(r, 'gatling'); }
  } else if (r.gunOn && ready(r, 'gatling')) { r.gunHot = true; r.gunLeft = CFG.gatlingDuration; }
  if (r.gunHot && r.gunT <= 0) {
    r.gunT = 1 / CFG.gatlingRate;
    const d = aimAt(r, CFG.gatlingSpeed, CFG.gatlingLead);
    const sa = (Math.random() * 2 - 1) * CFG.gatlingSpread * Math.PI / 180, cs = Math.cos(sa), sn = Math.sin(sa);
    fireShot(r, d.x * cs - d.z * sn, d.x * sn + d.z * cs, true);
  }
  r.shieldT = Math.max(0, r.shieldT - dt);
  r.slamCd = Math.max(0, r.slamCd - dt);
  if (r.slamT >= 0) {
    r.slamT += dt; const k = r.slamT / CFG.slamTime;
    if (k >= 1) { r.slamT = -1; r.y = 0; landSlam(r); } else r.y = 4 * CFG.slamHeight * k * (1 - k);
  }
  r.flash = Math.max(0, r.flash - dt * 6);
}

let bumpT = 0;
function collideRobots() {
  const a = player, b = bot;
  if (a.y > 0.3 || b.y > 0.3) return;               // a slamming robot hops over the other one
  let nx = b.x - a.x, nz = b.z - a.z; const d = Math.hypot(nx, nz), min = CFG.robotR * 2;
  if (d >= min) return;
  if (d < 1e-4) { nx = 1; nz = 0; } else { nx /= d; nz /= d; }
  const push = (min - d) / 2;
  a.x = clampX(a.x - nx * push); a.z = clampZ(a.z - nz * push); b.x = clampX(b.x + nx * push); b.z = clampZ(b.z + nz * push);
  if (bumpT <= 0) {                                 // a bump: swap the closing speed (elastic), then both fly apart, and both lose steering for a moment
    const rel = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
    if (rel < 0) { a.vx += rel * nx; a.vz += rel * nz; b.vx -= rel * nx; b.vz -= rel * nz; }
    a.vx -= nx * CFG.robotBounce; a.vz -= nz * CFG.robotBounce; b.vx += nx * CFG.robotBounce; b.vz += nz * CFG.robotBounce;
    a.lockT = b.lockT = CFG.hitLock; bumpT = CFG.bumpCd;
    addRing((a.x + b.x) / 2, (a.z + b.z) / 2, 0xffffff, 1.4);
  }
  for (const [r, o, sg] of [[a, b, 1], [b, a, -1]])    // Spikes: contact hurts, at most once per interval
    if (r.abilities.has('spikes') && r.spikeCd <= 0 && o.shieldT <= 0) {
      hurt(o, CFG.spikesDamage, 1); r.spikeCd = CFG.spikesInterval;
    }
}

function stepLasers(dt) {
  for (let i = lasers.length - 1; i >= 0; i--) {
    const s = lasers[i], e = enemyOf(s.owner);
    const n = Math.max(1, Math.ceil(Math.hypot(s.vx, s.vz) * dt / 0.6)), h = dt / n;
    let dead = false;
    for (let k = 0; k < n && !dead; k++) {
      s.x += s.vx * h; s.z += s.vz * h;
      if (s.split) { s.trav += Math.hypot(s.vx, s.vz) * h; if (s.trav >= CFG.laserSplit) { splitBolt(s); dead = true; break; } }
      dead = Math.abs(s.x) > HW || Math.abs(s.z) > HD;
      if (dead && (s.bounced || 0) < CFG.ricochetBounces && s.owner.abilities.has('ricochet')) {
        if (Math.abs(s.x) > HW) { s.vx = -s.vx; s.x = Math.sign(s.x) * HW; }
        if (Math.abs(s.z) > HD) { s.vz = -s.vz; s.z = Math.sign(s.z) * HD; }
        s.bounced = (s.bounced || 0) + 1; s.m.rotation.y = Math.atan2(s.vx, s.vz); dead = false;
      }
      if (!dead) for (const t of turrets)
        if (Math.hypot(t.x - s.x, t.z - s.z) < CFG.turretRadius + 0.1) { dead = true; break; }
      const hd = Math.hypot(s.x - e.x, s.z - e.z);
      if (!dead && hd < CFG.robotR + 0.2) {
        if (e.shieldT <= 0 && e.abilities.has('deflector') && Math.random() < CFG.deflectChance) {
          const nx = hd > 1e-4 ? (s.x - e.x) / hd : 1, nz = hd > 1e-4 ? (s.z - e.z) / hd : 0, vn = s.vx * nx + s.vz * nz;
          if (vn < 0) { s.vx -= 2 * vn * nx; s.vz -= 2 * vn * nz; }
          s.x = e.x + nx * (CFG.robotR + 0.22); s.z = e.z + nz * (CFG.robotR + 0.22);
          s.m.rotation.y = Math.atan2(s.vx, s.vz);
          addRing(s.x, s.z, 0xffffff, 0.8);
        } else {
          dead = true;
          if (e.shieldT <= 0) {
            hurt(e, s.dmg, s.flash || 1);
            if (s.push) { const sp = Math.hypot(s.vx, s.vz) || 1; knock(e, s.vx / sp, s.vz / sp, CFG.pusherKnock); addRing(e.x, e.z, 0xffffff, 1.3); }
          }
        }
      }
    }
    if (dead) { scene.remove(s.m); lasers.splice(i, 1); } else s.m.position.set(s.x, CFG.robotH * 0.6, s.z);
  }
}

  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const options = pool.slice(0, CFG.draftOptions);
  if (!match.firstPicker) match.firstPicker = Math.random() < 0.5 ? 'you' : 'bot'; else match.firstPicker = match.firstPicker === 'you' ? 'bot' : 'you';
  const first = match.firstPicker;
  draft = { order: [first, first === 'you' ? 'bot' : 'you'], i: 0, options, taken: new Set() };
  dui.title.textContent = 'ROUND ' + match.round;
  dui.goal.textContent = 'FIRST TO ' + CFG.roundsToWin;
  dui.cards.innerHTML = '';
  for (const id of options) {
    const a = ABILITIES[id], c = document.createElement('div');
    c.className = 'card n-' + a.nature; c.dataset.id = id;
    c.innerHTML = '<span class="owner"></span>' +
      (a.cd != null ? `<span class="badge">⏱ ${a.cd}<small>s</small></span>` : '') +
      `<div class="art">${svgIcon(id)}</div><div class="name">${a.name}</div>` +
      `<div class="tags"><span class="chip nat">${NATURE[a.nature]}</span><span class="chip typ">${a.type}</span></div>` +
      `<div class="desc">${a.desc}</div>`;
    c.addEventListener('click', () => { if (draft && draft.order[draft.i] === 'you') draftPick('you', id); });
    dui.cards.appendChild(c);
  }
  renderMatchUI();
  dui.root.classList.remove('hidden');
  draftNext();
}
const pickable = id => !draft.taken.has(id);       // every card goes to one side only, stackable or not
function draftPick(who, id) {
  if (!pickable(id) || draft.order[draft.i] !== who) return;
  const c = dui.cards.querySelector(`[data-id="${id}"]`);
  draft.taken.add(id);
  if (CFG.stackable.includes(id)) match.stacks[who][id]++; else match.owned[id] = who;
  c.classList.add('taken', who === 'you' ? 'mine' : 'theirs');
  c.querySelector('.owner').textContent = who === 'you' ? 'YOU' : 'BOT';
  draft.i++;
  renderMatchUI();
  draftNext();
}
function draftNext() {
  const d = draft, who = d.order[d.i], left = d.options.filter(id => pickable(id));
  dui.cards.classList.toggle('myturn', who === 'you');
  dui.root.querySelector('.side.you').classList.toggle('turn', who === 'you');
  dui.root.querySelector('.side.bot').classList.toggle('turn', who === 'bot');
  if (d.i >= d.order.length || !left.length) { dui.status.textContent = 'FIGHT!'; setTimeout(() => d === draft && endDraft(), 900); return; }
  if (who === 'bot') {
    dui.status.textContent = d.i === 0 ? 'Bot picks first…' : 'Bot is picking…';
    setTimeout(() => d === draft && draftPick('bot', left[Math.floor(Math.random() * left.length)]), 900);
  } else dui.status.textContent = d.i === 0 ? 'You pick first: tap a card' : 'Your pick: tap a card';
}
function endDraft() {
  for (const r of robots) { const w = r.isPlayer ? 'you' : 'bot'; r.abilities = new Set(ownedBy(w)); r.stacks = match.stacks[w]; }
  for (const id in ABILITIES) if (ABILITIES[id].btn) document.getElementById(ABILITIES[id].btn).style.display = player.abilities.has(id) ? 'flex' : 'none';
  draft = null; dui.root.classList.add('hidden');
  layoutButtons();
  reset(); state = 'playing';
}
function layoutButtons() {
  const row = document.getElementById('controls'), n = Math.max(1, [...player.abilities].filter(id => ABILITIES[id].btn).length);
  const size = Math.max(34, Math.min(56, Math.floor((document.getElementById('btnRow').clientWidth || 300) / n) - 8));
  row.style.setProperty('--bs', size + 'px');
  placeJoy();
}
window.addEventListener('resize', layoutButtons);
function endRound(winner, now) {
  state = 'over'; overlayShownAt = now;
  for (const r of robots) { r.firing = false; r.gunHot = false; }
  joy.id = null; joy.x = joy.z = 0; joyEl.classList.remove('on'); placeJoy();
  match.wins[winner]++;
  const score = `YOU ${match.wins.you} – ${match.wins.bot} BOT`, col = winner === 'you' ? '#2f7df6' : '#f0443e';
  if (match.wins[winner] >= CFG.roundsToWin) {
    match.done = true; renderMatchUI();
    showOverlay(winner === 'you' ? 'MATCH WON!' : 'MATCH LOST', score + '\nTAP FOR A NEW MATCH', col);
  } else {
    renderMatchUI(); match.round++;
    showOverlay(winner === 'you' ? 'ROUND WON' : 'ROUND LOST', score + '\nTAP TO DRAFT FOR ROUND ' + match.round, col);
  }
}

function setBtn(id, active) {
  const b = btns[id], cd = player.cdl[id] || 0;
  b.el.classList.toggle('dim', cd > 0);
  b.knob.style.setProperty('--p', cd > 0 ? (1 - cd / CFG.cooldown[id]).toFixed(3) : 1);
  const txt = cd > 0 ? Math.ceil(cd) : '';
  if (b.lastTxt !== String(txt)) { b.left.textContent = txt; b.lastTxt = String(txt); }
  b.el.classList.toggle('pressed', !!active || cd > b.lastCd + 0.01);     // lights up while firing and when it just fired
  b.lastCd = cd;
}
function syncVisuals(time) {
  for (const r of robots) {
    r.mesh.position.set(r.x, CFG.robotH / 2 + r.y, r.z);
    r.mat.emissive.setScalar(r.flash * 0.8);
    r.slowRing.visible = r.slowT > 0 && (r.slowT > 0.6 || Math.sin(time * 40) > 0);
    r.shield.visible = r.shieldT > 0 && (r.shieldT > 0.6 || Math.sin(time * 40) > 0);
  }
  ui.hpYou.style.width = (player.hp / player.maxHp * 100) + '%';
  ui.hpBot.style.width = (bot.hp / bot.maxHp * 100) + '%';
  ui.hpYouNum.textContent = Math.ceil(player.hp);
  ui.hpBotNum.textContent = Math.ceil(bot.hp);
  for (const id in btns) if (player.abilities.has(id))
    setBtn(id, id === 'flame' ? player.firing : id === 'gatling' ? player.gunHot : id === 'slam' ? player.slamT >= 0 : id === 'shield' ? player.shieldT > 0 : false);
}

// ---------- Loop ----------
let last = performance.now();
function simStep(dt, now) {
  if (state === 'playing') {
    const pin = playerInput(), bin = botInput(dt);
    autoFire(player, dt); autoFire(bot, dt);
    stepRobot(player, dt, pin.x, pin.z); stepRobot(bot, dt, bin.x, bin.z);
    bumpT = Math.max(0, bumpT - dt);
    collideRobots(); collideTurrets();
    stepLasers(dt); stepHooks(dt); stepShells(dt); stepMines(dt, now / 1000); stepTurrets(dt, now / 1000);
    if (player.hp <= 0 || bot.hp <= 0) endRound(bot.hp <= 0 ? 'you' : 'bot', now);
  }
  stepPuffs(dt); stepRings(dt); stepWalls(dt);
}
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  simStep(dt, now);
  syncVisuals(now / 1000);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
fitCamera();
reset();
requestAnimationFrame(frame);

window.RoBotFight = { CFG, player, bot, lasers, get state() { return state; }, get draft() { return draft; }, hooks, get match() { return match; }, mines, turrets, shells, walls, step: simStep, reset, setInput: f => { inputOverride = f; }, setBotInput: f => { botOverride = f; }, botFlags, ai };
})();
</script>
</body>
</html>
