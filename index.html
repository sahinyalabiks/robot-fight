<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e9edf3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>RoBot Fight</title>
<style>
  :root { --blue:#2f7df6; --red:#f0443e; --bg:#e9edf3; --ink:#2a3342; --muted:#c9d1dc; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#d5dbe4; overflow:hidden; overscroll-behavior:none;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:var(--ink);
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
  #app { position:relative; height:100%; width:100%; max-width:calc(100vh * 0.6); margin:0 auto;
    background:var(--bg); display:flex; flex-direction:column; overflow:hidden; }
  @media (pointer:coarse), (max-width:600px) { #app { max-width:none; } html, body { background:var(--bg); } }

  /* HUD */
  #hud { flex:0 0 auto; height:calc(40px + env(safe-area-inset-top)); padding:calc(8px + env(safe-area-inset-top)) 14px 0;
    display:flex; gap:12px; align-items:center; font-size:11px; font-weight:700; letter-spacing:.08em; }
  .hp { flex:1; display:flex; align-items:center; gap:8px; }
  .hp.bot { flex-direction:row-reverse; }
  .hp .bar { position:relative; flex:1; height:18px; border-radius:9px; background:var(--muted); overflow:hidden; }
  .hp .fill { height:100%; width:100%; border-radius:9px; transition:width .12s linear; }
  .hp .num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900;
    letter-spacing:.02em; color:#fff; -webkit-text-stroke:3px #1c2533; paint-order:stroke fill; }
  .hp.you .fill { background:var(--blue); }
  .hp.bot .fill { background:var(--red); margin-left:auto; }

  /* Arena viewport */
  #stage { flex:1 1 auto; position:relative; min-height:0; }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }

  /* Rising damage numbers */
  .dmg { position:absolute; z-index:3; pointer-events:none; font-weight:900; color:#ffd60a; line-height:1;
    -webkit-text-stroke:4px #000; paint-order:stroke fill; transform:translate(-50%,-50%);
    animation:dmgRise .85s ease-out forwards; }
  @keyframes dmgRise {
    0% { transform:translate(-50%,-50%) scale(.6); opacity:1; }
    15% { transform:translate(-50%,-90%) scale(1.15); opacity:1; }
    70% { opacity:1; }
    100% { transform:translate(-50%,-320%) scale(1); opacity:0; }
  }

  /* Controls: bottom quarter */
  #controls { flex:0 0 19%; min-height:136px; position:relative; display:flex; justify-content:space-around; align-items:center;
    padding-bottom:env(safe-area-inset-bottom); background:var(--bg); }
  /* Shared energy bar: 10 pips, fills smoothly */
  #energy { flex:0 0 auto; position:relative; height:14px; margin:2px 14px 8px; border-radius:7px; background:var(--muted); overflow:hidden; }
  #energyFill { height:100%; width:100%; background:linear-gradient(#b07cff, #8b5cf6); }
  #energy::after { content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--bg) calc(10% - 2px) 10%); }
  #btnThrust { display:none; }   /* thrusters are shelved: CFG.thrustersEnabled brings the button back */
  .ability.tap .knob { width:70px; height:70px; transition:transform .06s; }
  .ability.tap.pressed .knob { transform:scale(.88); }
  .ability { position:relative; width:112px; height:112px; display:flex; align-items:center; justify-content:center; touch-action:none; }
  .ability .base { position:absolute; inset:0; border-radius:50%; background:rgba(47,125,246,.10);
    border:2px solid rgba(47,125,246,.35); opacity:0; transform:scale(.6); transition:opacity .1s, transform .1s; }
  .ability.active .base { opacity:1; transform:scale(1); }
  .ability .knob { --p:1; position:relative; width:76px; height:76px; border-radius:50%;
    background:conic-gradient(var(--blue) calc(var(--p) * 360deg), var(--muted) 0);
    display:flex; align-items:center; justify-content:center; will-change:transform;
    box-shadow:0 3px 8px rgba(40,60,90,.18); }
  .ability .knob::before { content:""; position:absolute; inset:6px; border-radius:50%; background:#fff; }
  .ability .knob span { position:relative; font-size:11px; font-weight:800; letter-spacing:.08em; color:var(--blue); }
  .ability.dim .knob span { color:#9aa6b6; }
  .ability.dim .knob { box-shadow:none; }
  .ability.active .knob { width:60px; height:60px; }
  .ability.active .knob span { font-size:9px; }

  /* Draft screen: a grid of collectible-style cards + a detail panel for the selected one */
  #draft { position:absolute; inset:0; z-index:9; background:var(--bg); display:flex; flex-direction:column; align-items:stretch;
    padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); gap:8px; overflow:hidden; }
  #draft.hidden { display:none; }
  #draftHead { display:flex; flex-direction:column; gap:3px; }
  #draft h2 { margin:0; text-align:center; font-size:22px; letter-spacing:.06em; }
  #draft p { margin:0; text-align:center; font-size:12px; font-weight:600; color:#6b778a; }
  #draftStatus { min-height:19px; font-size:15px !important; color:var(--ink) !important; font-weight:800 !important; letter-spacing:.04em; }
  #cards { flex:1 1 auto; min-height:0; overflow-y:auto; touch-action:pan-y; display:grid; grid-template-columns:repeat(3, 1fr);
    gap:13px 10px; align-content:start; padding:9px 7px 6px; }
  .n-weapon { --n1:#ffb866; --n2:#f2711c; --nb:#d85a0a; }
  .n-enhancement { --n1:#63e2d1; --n2:#12a594; --nb:#0b8577; }
  .n-deployable { --n1:#f9a3d6; --n2:#d6409f; --nb:#b02a80; }
  .card { position:relative; background:#fff; border:3px solid var(--nb); border-radius:13px; padding-bottom:6px;
    box-shadow:0 3px 0 var(--nb), 0 5px 9px rgba(40,60,90,.16); transition:transform .08s; }
  .card .art { height:52px; border-radius:9px 9px 0 0; background:linear-gradient(160deg, var(--n1), var(--n2));
    display:flex; align-items:center; justify-content:center; }
  .card .art svg { width:42px; height:42px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.18)); }
  .card .name { text-align:center; font-size:13px; font-weight:900; letter-spacing:.03em; margin:5px 2px 4px; }
  .card .tags { display:flex; justify-content:center; gap:3px; flex-wrap:wrap; padding:0 3px; }
  .chip { font-size:8.5px; font-weight:800; letter-spacing:.06em; border-radius:6px; padding:2px 5px; background:#e8edf4; color:#5b6b82; white-space:nowrap; }
  .chip.nat { background:var(--n2); color:#fff; }
  .card .badge { position:absolute; top:-9px; left:-8px; min-width:28px; height:28px; padding:0 5px; border-radius:14px; background:#8b5cf6;
    border:2.5px solid #fff; box-shadow:0 2px 4px rgba(60,30,120,.35); color:#fff; font-size:14px; font-weight:900;
    display:flex; align-items:baseline; justify-content:center; line-height:23px; }
  .card .badge small { font-size:8px; font-weight:800; margin-left:1px; }
  .card .cdchip { position:absolute; top:4px; right:4px; font-size:9px; font-weight:800; color:#fff; background:rgba(28,37,51,.72); border-radius:7px; padding:1px 5px; }
  .card .owner { display:none; position:absolute; top:20px; left:50%; transform:translateX(-50%) rotate(-7deg); font-size:13px; font-weight:900;
    letter-spacing:.1em; color:#fff; border-radius:8px; padding:2px 11px; border:2px solid #fff; z-index:1; }
  .card.sel { transform:translateY(-4px); outline:3px solid var(--ink); outline-offset:2px; }
  .card.taken .owner { display:block; }
  .card.taken .art, .card.taken .name, .card.taken .tags, .card.taken .badge { opacity:.35; filter:grayscale(.8); }
  .card.mine { border-color:var(--blue); box-shadow:0 3px 0 var(--blue); } .card.mine .owner { background:var(--blue); }
  .card.theirs { border-color:var(--red); box-shadow:0 3px 0 var(--red); } .card.theirs .owner { background:var(--red); }
  #detail { flex:0 0 auto; background:#fff; border-radius:14px; padding:11px 13px 12px; box-shadow:0 2px 8px rgba(40,60,90,.12); min-height:142px;
    display:flex; flex-direction:column; gap:5px; }
  #detail .dtop { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #detail .dname { font-size:17px; font-weight:900; letter-spacing:.03em; margin-right:2px; }
  #detail .chip { font-size:9.5px; padding:3px 7px; }
  #detail .dstats { font-size:12px; font-weight:800; color:#7c4ddb; }
  #detail .ddesc { font-size:13px; line-height:1.35; color:#536074; flex:1; }
  #detail .hint { margin:auto; font-size:13px; font-weight:600; color:#8a96a8; }
  #pickBtn { width:100%; height:44px; border:0; border-radius:12px; background:var(--blue); color:#fff; font:800 15px/1 inherit; font-family:inherit;
    letter-spacing:.06em; box-shadow:0 3px 0 #1f5fd0; }
  #pickBtn:active { transform:translateY(2px); box-shadow:0 1px 0 #1f5fd0; }
  #pickBtn:disabled { background:var(--muted); color:#7a8699; box-shadow:none; transform:none; }

  /* Overlay */
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(233,237,243,.82); z-index:10; text-align:center; gap:10px; }
  #overlay.hidden { display:none; }
  #overlay h1 { margin:0; font-size:38px; letter-spacing:.04em; }
  #overlay p { margin:0; font-size:14px; font-weight:600; color:#6b778a; letter-spacing:.06em; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hp you"><span>YOU</span><div class="bar"><div class="fill" id="hpYou"></div><span class="num" id="hpYouNum"></span></div></div>
    <div class="hp bot"><span>BOT</span><div class="bar"><div class="fill" id="hpBot"></div><span class="num" id="hpBotNum"></span></div></div>
  </div>
  <div id="stage"></div>
  <div id="energy"><div id="energyFill"></div></div>
  <div id="controls">
    <div class="ability" id="btnThrust"><div class="base"></div><div class="knob"><span>THRUST</span></div></div>
    <div class="ability" id="btnFlame"><div class="base"></div><div class="knob"><span>FLAME</span></div></div>
    <div class="ability tap" id="btnSlam"><div class="knob"><span>SLAM</span></div></div>
    <div class="ability tap" id="btnShield"><div class="knob"><span>SHIELD</span></div></div>
    <div class="ability tap" id="btnMine"><div class="knob"><span>MINE</span></div></div>
    <div class="ability tap" id="btnTurret"><div class="knob"><span>TURRET</span></div></div>
    <div class="ability" id="btnGatling"><div class="base"></div><div class="knob"><span>GATLING</span></div></div>
    <div class="ability" id="btnMortar"><div class="base"></div><div class="knob"><span>MORTAR</span></div></div>
    <div class="ability" id="btnLaser"><div class="base"></div><div class="knob"><span>LASER</span></div></div>
  </div>
  <div id="draft" class="hidden">
    <div id="draftHead">
      <h2>PICK ABILITIES</h2>
      <p id="draftOrder"></p>
      <p id="draftStatus"></p>
    </div>
    <div id="cards"></div>
    <div id="detail"></div>
  </div>
  <div id="overlay"><h1 id="ovTitle">ROBOT FIGHT</h1><p id="ovSub">TAP TO START</p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

// ---------- Tuning ----------
const CFG = {
  arenaW: 10, arenaD: 20, wallH: 0.6, wallT: 0.4,
  robotR: 0.75, robotH: 0.55,
  baseSpeed: 2.75,
  // Flamer: short-range continuous cone, paid for with energy
  flameRange: 3.2,          // reach measured from the robot's edge
  flameHalfAngle: 16,       // degrees
  flameDps: 12,
  flameCost: 20,            // energy per second while firing
  flameMinStart: 5,         // energy needed to ignite
  // Slam: tap, hop up, land, damage everything close
  slamCost: 30,
  slamSettle: 0.4,          // hidden lockout after landing before the next slam
  slamTime: 0.5,            // seconds in the air
  slamHeight: 1.3,
  slamRadius: 2.5,          // centre-to-centre distance that gets hit on landing
  slamDamage: 30,
  // Shield: tap, invulnerable for a while
  shieldCost: 10,
  shieldTime: 3,
  // Mortar: slow lobbed shell, area damage where it lands
  mortarCost: 35,
  mortarDamage: 20,
  mortarRadius: 2.2,        // blast radius drawn on the floor
  mortarFlight: 1.75,        // seconds in the air, whatever the range
  mortarHeight: 4,
  mortarMinRange: 2.5, mortarMaxRange: 12,
  // Gatling: hold to stream bullets with unlimited range; short aim line makes it harder to aim
  gatlingRate: 5,           // shots per second
  gatlingCost: 3,           // energy per shot (15 per second of fire)
  gatlingDamage: 2,         // per bullet
  gatlingSpeed: 14,
  gatlingSpread: 3,         // degrees either side
  gatlingAimLen: 3.5,       // aim line length (laser's is 9)
  // Cooldowns in seconds, on top of the energy cost (0 = energy only). Starts when the ability is used.
  // Mine: dropped where you stand, arms after a moment, explodes when the enemy rolls over it
  mineCost: 20,
  mineDamage: 20,
  mineArm: 1,               // seconds before it becomes live
  mineMax: 2,               // per robot; dropping another removes the oldest
  mineTrigger: 0.45,        // extra reach beyond the robot's radius
  // Turret: dropped where you stand, shoots gatling-strength bullets on its own for a while
  turretCost: 40,
  turretLife: 8,
  turretInterval: 0.6,      // seconds between shots
  turretSpread: 6,        // degrees either side
  // Spikes: passive, every robot-to-robot bump hurts the other robot
  spikesDamage: 10,
  // (Ricochet: passive, your laser / gatling / turret shots bounce off a wall once. No numbers to tune.)
  cooldown: { laser: 0, flame: 0, slam: 0, shield: 15, mortar: 0, gatling: 0, mine: 3, turret: 0 },
  // Draft: abilities each side ends up with
  picksEach: 3,
  // Durability: passive, raises max HP
  durabilityBonus: 0.25,
  // Thrusters (shelved: button hidden and bot does not use them while this is false)
  thrustersEnabled: false,
  thrustForce: 10,          // acceleration while thrusting (units/s^2)
  thrustMaxSpeed: 4.5,      // raised speed cap while thrusting
  thrustMinSpeed: 0.9,      // how far you can brake while thrusting
  thrustDrain: 1 / 2.5,     // charge per second while thrusting
  thrustRegen: 1 / 5.0,     // charge per second while released
  thrustRegenDelay: 0.5,
  thrustMinStart: 0.12,     // charge needed to (re)ignite
  thrustInvert: true,       // true: force is OPPOSITE to drag direction (exhaust points where you drag)
  speedReturn: 25,          // how fast speed snaps back to base after thrust ends
  // Laser
  // Energy: one shared pool pays for every ability
  energyMax: 100,
  energyRegen: 5,           // per second, added smoothly every frame
  laserCost: 20,            // per 5-shot burst
  laserShots: 5, laserInterval: 0.09,
  laserSpeed: 11, laserDamage: 3,
  laserSpread: 5,           // each shot deviates randomly by up to this many degrees either side
  laserLen: 0.9,
  maxHp: 100,
  camElevation: 58          // degrees above the floor plane
};
const BLUE = 0x2f7df6, RED = 0xf0443e;

// ---------- Scene ----------
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0xe9edf3);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
{
  const a = CFG.camElevation * Math.PI / 180;
  camera.position.set(0, 30 * Math.sin(a), 30 * Math.cos(a));
  camera.lookAt(0, 0, 0);
  camera.updateMatrixWorld(true);
}

scene.add(new THREE.HemisphereLight(0xffffff, 0xcfd6e0, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.35);
sun.position.set(5, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
sun.shadow.radius = 3;
scene.add(sun);

// Arena
const HW = CFG.arenaW / 2, HD = CFG.arenaD / 2;
{
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(CFG.arenaW, CFG.arenaD),
    new THREE.MeshLambertMaterial({ color: 0xf7f9fc }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  const line = new THREE.Mesh(new THREE.PlaneGeometry(CFG.arenaW, 0.06),
    new THREE.MeshBasicMaterial({ color: 0xdfe5ed }));
  line.rotation.x = -Math.PI / 2; line.position.y = 0.005; scene.add(line);

  const wallMat = new THREE.MeshLambertMaterial({ color: 0xa9b4c6 });
  const t = CFG.wallT, h = CFG.wallH;
  const mk = (w, d, x, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
    m.position.set(x, h / 2, z); m.castShadow = true; m.receiveShadow = true; scene.add(m);
  };
  mk(CFG.arenaW + 2 * t, t, 0, -HD - t / 2);
  mk(CFG.arenaW + 2 * t, t, 0,  HD + t / 2);
  mk(t, CFG.arenaD, -HW - t / 2, 0);
  mk(t, CFG.arenaD,  HW + t / 2, 0);
}

// Fit the whole arena (incl. walls) inside the stage, whatever its aspect ratio
function fitCamera() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  const inv = camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  const v = new THREE.Vector3(), ex = HW + CFG.wallT, ez = HD + CFG.wallT;
  for (const x of [-ex, ex]) for (const y of [0, CFG.wallH]) for (const z of [-ez, ez]) {
    v.set(x, y, z).applyMatrix4(inv);
    minX = Math.min(minX, v.x); maxX = Math.max(maxX, v.x);
    minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  let hw = (maxX - minX) / 2 * 1.05, hh = (maxY - minY) / 2 * 1.05;
  const aspect = w / h;
  if (hw / hh > aspect) hh = hw / aspect; else hw = hh * aspect;
  camera.left = cx - hw; camera.right = cx + hw; camera.top = cy + hh; camera.bottom = cy - hh;
  camera.updateProjectionMatrix();
}
new ResizeObserver(fitCamera).observe(stage);
fitCamera();

// ---------- Robots ----------
function makeRobot(color, isPlayer) {
  const mat = new THREE.MeshLambertMaterial({ color });
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(CFG.robotR, CFG.robotR, CFG.robotH, 32), mat);
  mesh.castShadow = true;
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(CFG.robotR * 0.55, CFG.robotR * 0.55, 0.08, 24),
    new THREE.MeshLambertMaterial({ color: 0xffffff }));
  cap.position.y = CFG.robotH / 2 + 0.04; mesh.add(cap);
  scene.add(mesh);
  const spikes = new THREE.Group(); spikes.visible = false; mesh.add(spikes);
  {
    const g = new THREE.ConeGeometry(0.13, 0.32, 6), mt = new THREE.MeshLambertMaterial({ color: 0xf2f5f9 });
    for (let i = 0; i < 10; i++) {
      const pivot = new THREE.Object3D(); pivot.rotation.y = i / 10 * Math.PI * 2;
      const c = new THREE.Mesh(g, mt); c.rotation.z = -Math.PI / 2; c.position.x = CFG.robotR + 0.13; c.castShadow = true;
      pivot.add(c); spikes.add(pivot);
    }
  }
  const shield = new THREE.Mesh(new THREE.SphereGeometry(1.1, 24, 16),
    new THREE.MeshBasicMaterial({ color: isPlayer ? 0x7fb4ff : 0xff8f8a, transparent: true, opacity: 0.35, depthWrite: false }));
  shield.visible = false; mesh.add(shield);

  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.9, 12),
    new THREE.MeshBasicMaterial({ color: isPlayer ? 0x7fd0ff : 0xffb37a }));
  flame.visible = false; scene.add(flame);

  return { isPlayer, color, mesh, mat, flame, shield, spikes, shieldT: 0, abilities: new Set(), x: 0, z: 0, vx: 0, vz: 0, hp: CFG.maxHp,
    cd: 0, charge: 1, regenWait: 0, burst: null, thrust: null, thrusting: false, flash: 0,
    y: 0, fuel: 1, fuelWait: 0, fireOn: false, fireDir: null, firing: false, fireAcc: 0, slamCd: 0, slamT: -1 };
}
const player = makeRobot(BLUE, true);
const bot = makeRobot(RED, false);
const robots = [player, bot];
const enemyOf = r => (r === player ? bot : player);

// Aim preview for the laser
const aimLen = 9;
const aimGeo = new THREE.PlaneGeometry(0.22, aimLen); aimGeo.rotateX(-Math.PI / 2); aimGeo.translate(0, 0, aimLen / 2);
const aimLine = new THREE.Mesh(aimGeo, new THREE.MeshBasicMaterial({ color: BLUE, transparent: true, opacity: 0.28 }));
aimLine.position.y = 0.02; aimLine.visible = false; scene.add(aimLine);

// Aim preview for the gatling: same style as the laser's line, but much shorter
const gunAimGeo = new THREE.PlaneGeometry(0.22, CFG.gatlingAimLen); gunAimGeo.rotateX(-Math.PI / 2); gunAimGeo.translate(0, 0, CFG.gatlingAimLen / 2);
const gunAim = new THREE.Mesh(gunAimGeo, new THREE.MeshBasicMaterial({ color: BLUE, transparent: true, opacity: 0.28 }));
gunAim.position.y = 0.02; gunAim.visible = false; scene.add(gunAim);

// Aim preview for the flamer: a wedge exactly as long and wide as the area that deals damage
const flameAimGeo = new THREE.CircleGeometry(CFG.robotR + CFG.flameRange, 16,
  -CFG.flameHalfAngle * Math.PI / 180, 2 * CFG.flameHalfAngle * Math.PI / 180);
flameAimGeo.rotateX(-Math.PI / 2);   // lies flat, pointing along +x
const flameAim = new THREE.Mesh(flameAimGeo, new THREE.MeshBasicMaterial({ color: BLUE, transparent: true, opacity: 0.25, depthWrite: false }));

function foldAxis(v, m) { v = (((v + m) % (4 * m)) + 4 * m) % (4 * m); return (v > 2 * m ? 4 * m - v : v) - m; }

function stepTurrets(dt, time) {

    const e = enemyOf(t.owner), lead = Math.hypot(e.x - t.x, e.z - t.z) / CFG.gatlingSpeed;

}

// ---------- Input: Brawl-style buttons that turn into joysticks ----------
function makeStick(el) {
  const knob = el.querySelector('.knob');
  const R = 52, DEAD = 12;
  const s = { held: false, id: null, ox: 0, oy: 0, x: 0, y: 0, mag: 0, dragged: false, onRelease: null, el, knob };
  const set = (px, py) => {
    let dx = px - s.ox, dy = py - s.oy; const d = Math.hypot(dx, dy);
    if (d > DEAD) s.dragged = true;
    if (d > R) { dx *= R / d; dy *= R / d; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    if (d > DEAD) { s.x = dx / Math.hypot(dx, dy); s.y = dy / Math.hypot(dx, dy); s.mag = Math.min(1, d / R); }
    else { s.x = s.y = s.mag = 0; }
  };
  el.addEventListener('pointerdown', e => {
    if (s.held || (s.canStart && !s.canStart())) return;   // unavailable ability: stay a plain button
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    s.held = true; s.id = e.pointerId; s.ox = e.clientX; s.oy = e.clientY; s.dragged = false; s.x = s.y = s.mag = 0;
    el.classList.add('active');
  });
  el.addEventListener('pointermove', e => { if (s.held && e.pointerId === s.id) set(e.clientX, e.clientY); });
  const end = (e, cancelled) => {
    if (!s.held || e.pointerId !== s.id) return;
    s.held = false; s.id = null; el.classList.remove('active'); knob.style.transform = '';
    if (!cancelled && s.onRelease) s.onRelease(s);
    s.x = s.y = s.mag = 0;
  };
  el.addEventListener('pointerup', e => end(e, false));
  el.addEventListener('pointercancel', e => end(e, true));
  return s;
}

// ---------- Bot brain ----------
const ai = { dropWait: 2, gunning: false, gunErr: 0, mortarWait: 1, shieldScan: 0, slamScan: 0, fireWait: 1, thrustT: 0, nextThrust: 2, scan: 0, dir: { x: 0, z: 0 } };
function botThink(dt) {
  // Laser: lead the target a bit, with some aim error
  const has = id => bot.abilities.has(id);
  // Shield: raise it when something is about to hurt
  ai.shieldScan -= dt;
  if (has('shield') && ai.shieldScan <= 0) {
    ai.shieldScan = 0.1;
    if (bot.shieldT <= 0 && bot.energy >= CFG.shieldCost && ready(bot, 'shield')) {
      const gap = Math.hypot(player.x - bot.x, player.z - bot.z);
      let threat = (player.firing && gap < CFG.flameRange + CFG.robotR * 2.5) || (player.slamT >= 0 && gap < CFG.slamRadius * 1.3);
      for (const s of shells)        // a shell about to land nearby
        if (s.owner === player && s.t > CFG.mortarFlight * 0.6 && Math.hypot(bot.x - s.tx, bot.z - s.tz) < CFG.mortarRadius + 1.5) threat = true;
      for (const s of lasers) {
        if (threat) break;
        if (s.owner !== player) continue;
        const rx = bot.x - s.x, rz = bot.z - s.z;
        threat = Math.hypot(rx, rz) < 3 && rx * s.vx + rz * s.vz > 0;
      }
      if (threat && Math.random() < 0.6) startShield(bot);
    }
  }
  // Mine / Turret: drop them now and then, keeping some energy back
  ai.dropWait -= dt;
  if (ai.dropWait <= 0) {
    ai.dropWait = 0.5;
    if (has('turret') && bot.energy >= CFG.turretCost + 15 && !turrets.some(t => t.owner === bot)) { startTurret(bot); ai.dropWait = 2; }
    else if (has('mine') && bot.energy >= CFG.mineCost + 25 && ready(bot, 'mine') && Math.random() < 0.3) { startMine(bot); ai.dropWait = 2 + Math.random() * 3; }
  }
  // Mortar: aim where the player will be when the shell lands (wall bounces included), with some error
  if (has('mortar') && bot.energy >= CFG.mortarCost + 10 && ready(bot, 'mortar')) {
    ai.mortarWait -= dt;
    if (ai.mortarWait <= 0) {
      const fold = (v, m) => { v = (((v + m) % (4 * m)) + 4 * m) % (4 * m); return (v > 2 * m ? 4 * m - v : v) - m; };
      const t = CFG.mortarFlight;
      const px = fold(player.x + player.vx * t, HW - CFG.robotR) + (Math.random() - 0.5) * 2.6;
      const pz = fold(player.z + player.vz * t, HD - CFG.robotR) + (Math.random() - 0.5) * 2.6;
      const dx = px - bot.x, dz = pz - bot.z, d = Math.hypot(dx, dz) || 1;
      const tg = mortarTarget(bot, dx / d, dz / d, d);
      tryMortar(bot, tg.x, tg.z);
      ai.mortarWait = 0.5 + Math.random() * 2;
    }
  }
  // Gatling: fire in bursts (start with a decent reserve, stop when nearly empty), leading the target with some error
  if (has('gatling')) {
    if (!ai.gunning && bot.energy > 35) { ai.gunning = true; ai.gunErr = (Math.random() - 0.5) * 0.35; }
    if (ai.gunning && bot.energy < 8) ai.gunning = false;
    bot.gunOn = ai.gunning;
    const dist = Math.hypot(player.x - bot.x, player.z - bot.z), t = dist / CFG.gatlingSpeed * 0.8;
    const ang = Math.atan2(player.x + player.vx * t - bot.x, player.z + player.vz * t - bot.z) + ai.gunErr;
    bot.gunDir = { x: Math.sin(ang), z: Math.cos(ang) };
  } else bot.gunOn = false;
  if (has('laser') && bot.energy >= CFG.laserCost + 25 && !bot.burst) {   // keeps a reserve for flamer/slam
    ai.fireWait -= dt;
    if (ai.fireWait <= 0) {
      const dist = Math.hypot(player.x - bot.x, player.z - bot.z), t = dist / CFG.laserSpeed * 0.8;
      const ang = Math.atan2(player.x + player.vx * t - bot.x, player.z + player.vz * t - bot.z) + (Math.random() - 0.5) * 0.3;
      tryLaser(bot, { x: Math.sin(ang), z: Math.cos(ang) });
      ai.fireWait = 0.3 + Math.random() * 1.2;
    }
  }
  // Flamer: burn whenever the player is inside the cone's reach
  const pd = Math.hypot(player.x - bot.x, player.z - bot.z);
  bot.fireDir = null;
  bot.fireOn = has('flame') && pd < CFG.flameRange + CFG.robotR * 1.5 && (bot.firing || bot.energy > 15);
  // Slam: jump when the two robots are about to be close at landing time
  ai.slamScan -= dt;
  if (ai.slamScan <= 0) {
    ai.slamScan = 0.1;
    if (has('slam') && bot.energy >= CFG.slamCost && bot.slamCd <= 0 && bot.slamT < 0) {
      const t = CFG.slamTime;
      const fd = Math.hypot(player.x + player.vx * t - bot.x - bot.vx * t, player.z + player.vz * t - bot.z - bot.vz * t);
      if (fd < CFG.slamRadius * 0.7 && Math.random() < 0.5) startSlam(bot);
    }
  }
  if (!CFG.thrustersEnabled) { bot.thrust = null; return; }
  // Thrusters: dodge incoming shots, otherwise occasional random bursts
  if (ai.thrustT > 0) {
    ai.thrustT -= dt;
    bot.thrust = ai.thrustT > 0 ? { x: ai.dir.x, z: ai.dir.z, mag: 1 } : null;
    return;
  }
  bot.thrust = null;
  ai.nextThrust -= dt; ai.scan -= dt;
  if (ai.scan <= 0 && bot.charge > 0.3) {
    ai.scan = 0.15;
    for (const s of lasers) {
      if (s.owner !== player) continue;
      const rx = bot.x - s.x, rz = bot.z - s.z, d = Math.hypot(rx, rz);
      if (d > 7) continue;
      const ux = s.vx / CFG.laserSpeed, uz = s.vz / CFG.laserSpeed;
      const along = rx * ux + rz * uz, side = rx * -uz + rz * ux;
      if (along > 0 && Math.abs(side) < 1.6 && Math.random() < 0.6) {
        const sg = side >= 0 ? 1 : -1;
        ai.dir = { x: -uz * sg, z: ux * sg }; ai.thrustT = 0.45; return;
      }
    }
  }
  if (ai.nextThrust <= 0 && bot.charge > 0.6) {
    const a = Math.random() * Math.PI * 2;
    ai.dir = { x: Math.sin(a), z: Math.cos(a) };
    ai.thrustT = 0.4 + Math.random() * 0.6; ai.nextThrust = 1.5 + Math.random() * 3;
  }
}

// ---------- Simulation ----------
let state = 'menu';
function reset() {
  for (const s of lasers) scene.remove(s.m);
  lasers.length = 0;
  for (const mn of mines) removeMine(mn);
  mines.length = 0;
  for (const t of turrets) removeTurret(t);
  turrets.length = 0;
  for (const r of robots) r.spikes.visible = r.abilities.has('spikes');
  for (const s of shells) removeShell(s);
  shells.length = 0;
  for (const p of puffs) { p.m.visible = false; puffPool.push(p.m); }
  puffs.length = 0;
  for (const r of robots) {
    r.dmgAcc = 0; r.gunT = 0; r.gunOn = false; r.gunDir = null; r.gunDry = false;
    r.energy = CFG.energyMax; r.fireDry = false; r.shieldT = 0; r.cdl = {};
    r.y = 0; r.fireOn = false; r.fireDir = null; r.firing = false; r.slamCd = 0; r.slamT = -1;
    const a = (Math.random() * 0.5 + 0.25) * Math.PI * (Math.random() < 0.5 ? 1 : -1);
    r.x = (Math.random() - 0.5) * 4; r.z = r.isPlayer ? HD * 0.55 : -HD * 0.55;
    r.vx = Math.sin(a) * CFG.baseSpeed; r.vz = Math.cos(a) * CFG.baseSpeed * (r.isPlayer ? -1 : 1);
    r.maxHp = Math.round(CFG.maxHp * (r.abilities.has('durability') ? 1 + CFG.durabilityBonus : 1));
    r.hp = r.maxHp; r.cd = 0; r.charge = 1; r.regenWait = 0; r.burst = null; r.thrust = null; r.thrusting = false; r.flash = 0;
  }
  ai.fireWait = 1.2; ai.thrustT = 0; ai.nextThrust = 2;
}

function stepRobot(r, dt) {
  // Thrusters
  const want = r.thrust && r.thrust.mag > 0;
  if (want && (r.thrusting ? r.charge > 0 : r.charge >= CFG.thrustMinStart)) {
    r.thrusting = true;
    r.vx += r.thrust.x * r.thrust.mag * CFG.thrustForce * dt;
    r.vz += r.thrust.z * r.thrust.mag * CFG.thrustForce * dt;
    r.charge = Math.max(0, r.charge - CFG.thrustDrain * dt);
    r.regenWait = CFG.thrustRegenDelay;
  } else {
    r.thrusting = false;
    if (!want) {                       // no recharge while the button is still held
      r.regenWait -= dt;
      if (r.regenWait <= 0) r.charge = Math.min(1, r.charge + CFG.thrustRegen * dt);
    }
  }
  // Speed rule: constant speed, except thrusters may push it within [min, max]
  let sp = Math.hypot(r.vx, r.vz);
  if (sp < 1e-4) { r.vx = CFG.thrustMinSpeed; r.vz = 0; sp = CFG.thrustMinSpeed; }
  let target = sp;
  if (r.thrusting) target = Math.min(CFG.thrustMaxSpeed, Math.max(CFG.thrustMinSpeed, sp));
  else target = sp + (CFG.baseSpeed - sp) * Math.min(1, CFG.speedReturn * dt);
  r.vx *= target / sp; r.vz *= target / sp;

  // Move + wall bounce
  r.x += r.vx * dt; r.z += r.vz * dt;
  const mx = HW - CFG.robotR, mz = HD - CFG.robotR;
  if (r.x > mx) { r.x = mx; r.vx = -Math.abs(r.vx); } else if (r.x < -mx) { r.x = -mx; r.vx = Math.abs(r.vx); }
  if (r.z > mz) { r.z = mz; r.vz = -Math.abs(r.vz); } else if (r.z < -mz) { r.z = -mz; r.vz = Math.abs(r.vz); }

  // Energy trickles in every frame
  r.energy = Math.min(CFG.energyMax, r.energy + CFG.energyRegen * dt);
  // Flamer (once it runs dry it stays off until the button is released)
  if (!r.fireOn) r.fireDry = false;
  for (const id in r.cdl) r.cdl[id] = Math.max(0, r.cdl[id] - dt);
  if (r.firing && !(r.fireOn && !r.fireDry)) startCd(r, 'flame');
  if (r.fireOn && !r.fireDry && (r.firing || (r.energy >= CFG.flameMinStart && ready(r, 'flame')))) {
    r.firing = true;
    const e = enemyOf(r);
    let d = r.fireDir;
    if (!d) { const l = Math.hypot(e.x - r.x, e.z - r.z) || 1; d = { x: (e.x - r.x) / l, z: (e.z - r.z) / l }; }  // no drag: auto-aim
    r.energy = Math.max(0, r.energy - CFG.flameCost * dt);
    if (r.energy <= 0) r.fireDry = true;
    for (r.fireAcc += dt * 80; r.fireAcc >= 1; r.fireAcc--) spawnPuff(r, d.x, d.z);
    const rx = e.x - r.x, rz = e.z - r.z, along = rx * d.x + rz * d.z, side = Math.abs(rx * d.z - rz * d.x);
    const reach = along - CFG.robotR;             // distance past the shooter's edge
    if (e.shieldT <= 0 && along > 0 && reach < CFG.flameRange + CFG.robotR &&
        side < CFG.robotR + Math.max(0, reach) * Math.tan(CFG.flameHalfAngle * Math.PI / 180)) {
      hurt(e, CFG.flameDps * dt, 0.5, true);
    }
  } else {
    r.firing = false;
  }
  // Gatling: one bullet every 1/rate seconds while held (once out of energy it stays off until released)
  r.gunT = Math.max(0, r.gunT - dt);
  if (!r.gunOn) r.gunDry = false;
  if (r.gunOn && !r.gunDry && r.gunT <= 0 && ready(r, 'gatling')) {
    if (r.energy < CFG.gatlingCost) r.gunDry = true;
    else {
      r.energy -= CFG.gatlingCost; r.gunT = 1 / CFG.gatlingRate;
      let d = r.gunDir;
      if (!d) { const e = enemyOf(r), l = Math.hypot(e.x - r.x, e.z - r.z) || 1; d = { x: (e.x - r.x) / l, z: (e.z - r.z) / l }; }
      const sa = (Math.random() * 2 - 1) * CFG.gatlingSpread * Math.PI / 180, cs = Math.cos(sa), sn = Math.sin(sa);
      fireShot(r, d.x * cs - d.z * sn, d.x * sn + d.z * cs, true);
    }
  }
  r.shieldT = Math.max(0, r.shieldT - dt);
  // Slam: hop, then land
  r.slamCd = Math.max(0, r.slamCd - dt);
  if (r.slamT >= 0) {
    r.slamT += dt; const k = r.slamT / CFG.slamTime;
    if (k >= 1) { r.slamT = -1; r.y = 0; landSlam(r); } else r.y = 4 * CFG.slamHeight * k * (1 - k);
  }
  // Laser cooldown + burst
  r.cd = Math.max(0, r.cd - dt);
  if (r.burst) {
    r.burst.t -= dt;
    while (r.burst && r.burst.t <= 0) {
      let d = r.burst.dir;
      if (!d) { const e = enemyOf(r), l = Math.hypot(e.x - r.x, e.z - r.z) || 1; d = { x: (e.x - r.x) / l, z: (e.z - r.z) / l }; }
      const sa = (Math.random() * 2 - 1) * CFG.laserSpread * Math.PI / 180, cs = Math.cos(sa), sn = Math.sin(sa);
      fireShot(r, d.x * cs - d.z * sn, d.x * sn + d.z * cs);
      r.burst.t += CFG.laserInterval;
      if (--r.burst.n <= 0) r.burst = null;
    }
  }
  r.flash = Math.max(0, r.flash - dt * 6);
}

function collideRobots() {
  const a = player, b = bot;
  if (a.y > 0.3 || b.y > 0.3) return;   // a slamming robot hops over the other one
  let nx = b.x - a.x, nz = b.z - a.z; const d = Math.hypot(nx, nz), min = CFG.robotR * 2;
  if (d >= min) return;
  if (d < 1e-4) { nx = 1; nz = 0; } else { nx /= d; nz /= d; }
  const push = (min - d) / 2;
  a.x -= nx * push; a.z -= nz * push; b.x += nx * push; b.z += nz * push;
  const rel = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
  if (rel < 0) {                        // equal-mass elastic bounce: swap normal components
    for (const [r, o] of [[a, b], [b, a]])      // Spikes: the bump itself hurts
      if (r.abilities.has('spikes') && o.shieldT <= 0) hurt(o, CFG.spikesDamage, 1);
    a.vx += rel * nx; a.vz += rel * nz; b.vx -= rel * nx; b.vz -= rel * nz;
    // never let a bounce leave a robot stalled: keep them separating at base speed
    for (const [r, sg] of [[a, -1], [b, 1]]) {
      const sp = Math.hypot(r.vx, r.vz);
      if (sp < 0.5) { r.vx = nx * sg * CFG.baseSpeed; r.vz = nz * sg * CFG.baseSpeed; }
      else if (!r.thrusting) { r.vx *= CFG.baseSpeed / sp; r.vz *= CFG.baseSpeed / sp; }
    }
  }
}

function stepLasers(dt) {
  for (let i = lasers.length - 1; i >= 0; i--) {
    const s = lasers[i];
    s.x += s.vx * dt; s.z += s.vz * dt;
    const e = enemyOf(s.owner);
    let dead = Math.abs(s.x) > HW || Math.abs(s.z) > HD;
    if (dead && !s.bounced && s.owner.abilities.has('ricochet')) {     // Ricochet: one wall bounce
      if (Math.abs(s.x) > HW) { s.vx = -s.vx; s.x = Math.sign(s.x) * HW; }
      if (Math.abs(s.z) > HD) { s.vz = -s.vz; s.z = Math.sign(s.z) * HD; }
      s.bounced = true; s.m.rotation.y = Math.atan2(s.vx, s.vz); dead = false;
    }
    if (!dead && Math.hypot(e.x - s.x, e.z - s.z) < CFG.robotR + 0.2) {
      dead = true;
      if (e.shieldT <= 0) hurt(e, s.dmg, 1);
    }
    if (dead) { scene.remove(s.m); lasers.splice(i, 1); } else s.m.position.set(s.x, CFG.robotH * 0.6, s.z);
  }
}

const dui = { root: document.getElementById('draft'), cards: document.getElementById('cards'), detail: document.getElementById('detail'),
  order: document.getElementById('draftOrder'), status: document.getElementById('draftStatus') };
let draft = null;
function startDraft() {
  state = 'draft';
  const first = Math.random() < 0.5 ? 'you' : 'bot', second = first === 'you' ? 'bot' : 'you';
  // Order: first picks 1, second picks 2 in a row, then strictly one by one (first, second, first, ...)
  const order = [first, second, second].slice(0, CFG.picksEach * 2);
  const count = who => order.filter(o => o === who).length;
  for (let who = first; order.length < CFG.picksEach * 2; who = who === 'you' ? 'bot' : 'you')
    if (count(who) < CFG.picksEach) order.push(who);
  draft = { order, i: 0, owner: {}, sel: null };
  dui.order.textContent = (first === 'you' ? 'You pick first' : 'The bot picks first') +
    `, then ${first === 'you' ? 'the bot picks' : 'you pick'} 2, then one at a time. ${CFG.picksEach} each.`;
  dui.cards.innerHTML = '';
  const natOrder = Object.keys(NATURE);        // group the grid: weapons, enhancements, deployables
  for (const id of Object.keys(ABILITIES).sort((p, q) => natOrder.indexOf(ABILITIES[p].nature) - natOrder.indexOf(ABILITIES[q].nature))) {
    const a = ABILITIES[id], c = document.createElement('div');
    c.className = 'card n-' + a.nature; c.dataset.id = id;
    c.innerHTML = '<span class="owner"></span>' +
      (a.costNum != null ? `<span class="badge">${a.costNum}<small>${a.costUnit}</small></span>` : '') +
      (CFG.cooldown[id] > 0 ? `<span class="cdchip">⏱ ${CFG.cooldown[id]}s</span>` : '') +
      `<div class="art">${svgIcon(id)}</div><div class="name">${a.name}</div>` +
      `<div class="tags"><span class="chip nat">${NATURE[a.nature]}</span><span class="chip">${a.type}</span></div>`;
    c.addEventListener('click', () => { if (draft) { draft.sel = id; renderDetail(); } });   // tap = inspect; the PICK button confirms
    dui.cards.appendChild(c);
  }
  dui.root.classList.remove('hidden');
  draftNext();
}
// Detail panel: full description of the selected card and the button that picks it
function renderDetail() {
  const d = draft; if (!d) return;
  for (const c of dui.cards.children) c.classList.toggle('sel', c.dataset.id === d.sel);
  if (!d.sel) { dui.detail.innerHTML = '<div class="hint">Tap a card to see what it does.</div>'; return; }
  const id = d.sel, a = ABILITIES[id], owner = d.owner[id], myTurn = d.order[d.i] === 'you';
  const stats = (a.costNum != null ? `⚡ ${a.cost} energy` : 'No energy cost') + (CFG.cooldown[id] > 0 ? `  ·  ⏱ ${CFG.cooldown[id]}s cooldown` : '');
  const label = owner ? (owner === 'you' ? 'YOURS' : 'TAKEN BY BOT') : myTurn ? 'PICK ' + a.name.toUpperCase() : d.i >= d.order.length ? 'DRAFT DONE' : 'WAIT FOR YOUR TURN';
  dui.detail.innerHTML = `<div class="dtop n-${a.nature}"><span class="dname">${a.name}</span><span class="chip nat">${NATURE[a.nature]}</span>` +
    `<span class="chip">${a.how}</span></div><div class="dstats">${stats}</div><div class="ddesc">${a.desc}</div>` +
    `<button id="pickBtn" ${owner || !myTurn ? 'disabled' : ''}>${label}</button>`;
  dui.detail.querySelector('#pickBtn').addEventListener('click', () => { if (draft && draft.order[draft.i] === 'you') draftPick('you', id); });
}
function draftPick(who, id) {
  // Hard cap: nobody can end up with more than CFG.picksEach abilities, whatever the pick order does
  if (draft.owner[id] || Object.values(draft.owner).filter(o => o === who).length >= CFG.picksEach) return;
  draft.owner[id] = who; draft.i++;
  const c = dui.cards.querySelector(`[data-id="${id}"]`);
  c.classList.add('taken', who === 'you' ? 'mine' : 'theirs');
  c.querySelector('.owner').textContent = who === 'you' ? 'YOU' : 'BOT';
  draftNext();
}
// Bot always secures a weapon (an ability flagged weapon:true) and never takes the last one from a weaponless player
function botChoice(left) {
  const owns = who => Object.keys(draft.owner).some(id => draft.owner[id] === who && ABILITIES[id].weapon);
  const weapons = left.filter(id => ABILITIES[id].weapon);
  let pool = left;
  if (!owns('bot') && weapons.length) pool = weapons;
  else if (!owns('you') && weapons.length === 1 && left.length > 1) pool = left.filter(id => !ABILITIES[id].weapon);
  return pool[Math.floor(Math.random() * pool.length)];
}
function draftNext() {
  const d = draft, who = d.order[d.i], left = Object.keys(ABILITIES).filter(id => !d.owner[id]);
  renderDetail();
  if (d.i >= d.order.length) { dui.status.textContent = 'FIGHT!'; setTimeout(() => d === draft && endDraft(), 900); return; }
  if (who === 'bot') {
    dui.status.textContent = 'Bot is picking…';
    setTimeout(() => d === draft && draftPick('bot', botChoice(left)), 900);
  } else if (left.length === 1) {
    dui.status.textContent = 'The last one is yours';
    setTimeout(() => d === draft && draftPick('you', left[0]), 700);
  } else {
    let n = 0; while (d.order[d.i + n] === 'you') n++;
    dui.status.textContent = n > 1 ? `Your turn: pick ${n}` : 'Your turn: pick 1';
  }
}
function endDraft() {
  for (const r of robots) r.abilities = new Set(Object.keys(ABILITIES).filter(id => draft.owner[id] === (r.isPlayer ? 'you' : 'bot')));
  for (const id in ABILITIES) if (ABILITIES[id].btn) document.getElementById(ABILITIES[id].btn).style.display = player.abilities.has(id) ? 'flex' : 'none';
  draft = null; dui.root.classList.add('hidden');
  reset(); state = 'playing';
}

const UP = new THREE.Vector3(0, 1, 0), tmpV = new THREE.Vector3();
function syncVisuals(time) {
  for (const r of robots) {
    r.mesh.position.set(r.x, CFG.robotH / 2 + r.y, r.z);
    r.mat.emissive.setScalar(r.flash * 0.8);
    r.shield.visible = r.shieldT > 0 && (r.shieldT > 0.6 || Math.sin(time * 40) > 0);   // blinks before it drops
    r.flame.visible = r.thrusting;
    if (r.thrusting) {
      const l = Math.hypot(r.thrust.x, r.thrust.z) || 1, ex = -r.thrust.x / l, ez = -r.thrust.z / l; // exhaust direction
      const len = (0.7 + 0.3 * Math.sin(time * 40)) * (0.5 + 0.5 * r.thrust.mag);
      r.flame.scale.set(1, len, 1);
      r.flame.position.set(r.x + ex * (CFG.robotR + 0.45 * len), CFG.robotH / 2, r.z + ez * (CFG.robotR + 0.45 * len));
      r.flame.quaternion.setFromUnitVectors(UP, tmpV.set(ex, 0, ez));
    }
  }
  // Laser aim preview
  aimLine.visible = state === 'playing' && laserStick.held && laserStick.mag > 0;
  if (aimLine.visible) { aimLine.position.x = player.x; aimLine.position.z = player.z; aimLine.rotation.y = Math.atan2(laserStick.x, laserStick.y); }
  // Flamer aim preview (no drag = auto-aim, so it points at the bot)
  flameAim.visible = state === 'playing' && flameStick.held;
  if (flameAim.visible) {
    let fx = flameStick.x, fz = flameStick.y;
    if (flameStick.mag <= 0) { fx = bot.x - player.x; fz = bot.z - player.z; }
    flameAim.position.x = player.x; flameAim.position.z = player.z; flameAim.rotation.y = Math.atan2(-fz, fx);
  }
  // Gatling aim preview (no drag = auto-aim at the bot)
  gunAim.visible = state === 'playing' && gatlingStick.held;
  if (gunAim.visible) {
    let gx = gatlingStick.x, gz = gatlingStick.y;
    if (gatlingStick.mag <= 0) { gx = bot.x - player.x; gz = bot.z - player.z; }
    gunAim.position.x = player.x; gunAim.position.z = player.z; gunAim.rotation.y = Math.atan2(gx, gz);
  }
  // HUD + buttons
  ui.hpYou.style.width = (player.hp / player.maxHp * 100) + '%';
  ui.hpBot.style.width = (bot.hp / bot.maxHp * 100) + '%';
  ui.hpYouNum.textContent = Math.ceil(player.hp);
  ui.hpBotNum.textContent = Math.ceil(bot.hp);
  ui.energy.style.width = (player.energy / CFG.energyMax * 100).toFixed(2) + '%';
  // Buttons: grey when unusable; while on cooldown the ring refills to show the time left
  const setBtn = (b, id, blocked) => {
    const cd = player.cdl[id] || 0;
    b.el.classList.toggle('dim', blocked || cd > 0);
    b.knob.style.setProperty('--p', cd > 0 ? (1 - cd / CFG.cooldown[id]).toFixed(3) : blocked ? 0 : 1);
  };
  setBtn(laserStick, 'laser', player.energy < CFG.laserCost || !!player.burst);
  setBtn(flameStick, 'flame', !player.firing && (player.fireDry || player.energy < CFG.flameMinStart));
  setBtn(slamBtn, 'slam', player.energy < CFG.slamCost || player.slamCd > 0);
  setBtn(shieldBtn, 'shield', player.energy < CFG.shieldCost);
  setBtn(mortarStick, 'mortar', player.energy < CFG.mortarCost);
  setBtn(mineBtn, 'mine', player.energy < CFG.mineCost);
  setBtn(turretBtn, 'turret', player.energy < CFG.turretCost);
  setBtn(gatlingStick, 'gatling', player.gunDry || (!gatlingStick.held && player.energy < CFG.gatlingCost));
  // Mortar aim preview: arc dots + blast zone at the landing point
  const aimM = state === 'playing' && mortarStick.held && mortarStick.mag > 0;
  aimDisc.visible = aimM;
  if (aimM) {
    const t = mortarTarget(player, mortarStick.x, mortarStick.y, mortarRange(mortarStick.mag));
    aimDisc.position.x = t.x; aimDisc.position.z = t.z; aimDisc.scale.setScalar(CFG.mortarRadius);
    arcDots.forEach((d, i) => { const k = (i + 1) / (arcDots.length + 1);
      d.position.set(player.x + (t.x - player.x) * k, arcY(k), player.z + (t.z - player.z) * k); });
  }
  for (const d of arcDots) d.visible = aimM;
  thrustStick.knob.style.setProperty('--p', player.charge.toFixed(3));
  thrustStick.el.classList.toggle('dim', player.charge < CFG.thrustMinStart && !player.thrusting);
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'playing') {
    const sgn = CFG.thrustInvert ? -1 : 1;
    player.thrust = CFG.thrustersEnabled && thrustStick.held && thrustStick.mag > 0
      ? { x: thrustStick.x * sgn, z: thrustStick.y * sgn, mag: thrustStick.mag } : null;
    player.fireOn = flameStick.held;
    player.fireDir = flameStick.mag > 0 ? { x: flameStick.x, z: flameStick.y } : null;
    player.gunOn = gatlingStick.held;
    player.gunDir = gatlingStick.mag > 0 ? { x: gatlingStick.x, z: gatlingStick.y } : null;
    botThink(dt);
    stepRobot(player, dt); stepRobot(bot, dt);
    collideRobots();
    stepLasers(dt); stepShells(dt); stepMines(dt, now / 1000); stepTurrets(dt, now / 1000);
    if (player.hp <= 0 || bot.hp <= 0) {
      state = 'over'; overlayShownAt = now;
      player.thrusting = bot.thrusting = false;
      player.firing = bot.firing = false;
      if (bot.hp <= 0) showOverlay('YOU WIN', 'TAP TO PLAY AGAIN', '#2f7df6');
      else showOverlay('YOU LOSE', 'TAP TO PLAY AGAIN', '#f0443e');
    }
  }
  stepPuffs(dt); stepRings(dt);
  syncVisuals(now / 1000);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);

// Debug handle for tuning from the console
window.RoBotFight = { CFG, player, bot, lasers, get state() { return state; }, get draft() { return draft; }, mines, turrets };
})();
</script>
